<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vua Sư Tử - Gọi Món & Thanh Toán</title>
    <!-- FAVICON: Thay đổi biểu tượng chương trình -->
    <link rel="icon" type="image/png" href="img/logo.png">
    <script>if(!sessionStorage.getItem('vst_logged_in')) window.location.href='login.html';</script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        heading: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        "primary": "#d4a853",
                        "primary-soft": "#f0d68a",
                        "surface": "#0a1628",
                        "surface-container": "#101e35",
                        "surface-container-highest": "#1e3050",
                        "on-surface": "#e8ecf4",
                        "on-surface-variant": "#8b9ab8",
                        "background": "#0a1628",
                        "primary-container": "#c49a42",
                        "mau-xanh": "#4ade80",
                        "mau-do": "#f87171"
                    },
                    spacing: {
                        "sidebar-width": "76px",
                        "container-padding": "32px",
                        "grid-gutter": "24px",
                    }
                }
            }
        };
    </script>
    <style>
        .sidebar {
            background: linear-gradient(180deg, #0d1a30, #0a1628);
            border-right: 1px solid rgba(212, 168, 83, 0.08);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 76px;
            overflow: hidden;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }
        .sidebar.expanded { width: 240px; }
        .sidebar-text { display: none; white-space: nowrap; font-weight: 600; color: #e8ecf4; margin-left: 0.75rem; }
        .sidebar.expanded .sidebar-text { display: block; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-btn {
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            justify-content: flex-start;
            padding-left: 18px;
            width: 100%;
            height: 52px;
        }
        .nav-btn:hover { background: rgba(212, 168, 83, 0.08); }

        .glass-card {
            background: linear-gradient(145deg, rgba(16, 30, 53, 0.7), rgba(10, 22, 40, 0.8));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 168, 83, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .glass-card:hover {
            background: linear-gradient(145deg, rgba(16, 30, 53, 0.8), rgba(10, 22, 40, 0.9));
            border-color: rgba(212, 168, 83, 0.25);
            box-shadow: 
                0 16px 40px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        /* Mon item card */
        .mon-item {
            background: rgba(16, 30, 53, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 168, 83, 0.06);
            border-radius: 14px;
            padding: 0.85rem 1.1rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .mon-item:hover {
            border-color: rgba(212, 168, 83, 0.2);
            background: rgba(212, 168, 83, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .mon-item .mon-ten { font-weight: 500; font-size: 0.9rem; color: #e8ecf4; }
        .mon-item .mon-gia { color: #d4a853; font-weight: 600; font-size: 0.85rem; }
        
        .badge {
            display: inline-flex; align-items: center;
            padding: 0.25rem 0.65rem; font-size: 0.72rem;
            font-weight: 600; border-radius: 9999px;
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .badge-thucan { background: rgba(212,168,83,0.1); color: #d4a853; border: 1px solid rgba(212,168,83,0.2); }
        .badge-nuocuong { background: rgba(96,165,250,0.1); color: #60a5fa; border: 1px solid rgba(96,165,250,0.2); }
        .badge-cokhach { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
        .badge-trong { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 600; letter-spacing: 0.03em;
            transition: all 0.25s; border-radius: 12px;
            cursor: pointer; border: none;
        }
        .btn-sm { padding: 0.4rem 1rem; font-size: 0.72rem; border-radius: 10px; }
        .btn-primary { background: linear-gradient(135deg, #d4a853, #f0d68a, #c49a42); color: #0a1628; box-shadow: 0 2px 12px rgba(212,168,83,0.2); }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(212,168,83,0.35); }
        .btn-secondary { background: rgba(255,255,255,0.04); color: #e8ecf4; border: 1px solid rgba(255,255,255,0.08); }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); }
        .btn-danger { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.2); border-radius: 10px; padding: 0.35rem 0.65rem; }
        .btn-danger:hover { background: #f87171; color: #fff; }
        .btn-success {
            background: linear-gradient(135deg, #d4a853, #f0d68a, #c49a42);
            color: #0a1628; width: 100%; padding: 0.85rem;
            font-size: 0.85rem; border-radius: 14px; font-weight: 700;
            box-shadow: 0 4px 16px rgba(212,168,83,0.2);
        }
        .btn-success:hover { box-shadow: 0 8px 28px rgba(212,168,83,0.35); }

        .table-wrapper {
            overflow-x: auto; border-radius: 14px;
            border: 1px solid rgba(212,168,83,0.08);
            background: rgba(10,22,40,0.4);
        }
        .table-wrapper table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        .table-wrapper th { padding: 0.75rem 1rem; background: rgba(212,168,83,0.04); color: #d4a853; font-weight: 600; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; border-bottom: 1px solid rgba(212,168,83,0.08); }
        .table-wrapper td { padding: 0.85rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.03); color: #e8ecf4; }
        .table-wrapper tr:last-child td { border-bottom: none; }
        .table-wrapper tr:hover { background: rgba(212,168,83,0.03); }

        .menu-danh-sach {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }
        .menu-danh-sach::-webkit-scrollbar { width: 5px; }
        .menu-danh-sach::-webkit-scrollbar-track { background: transparent; }
        .menu-danh-sach::-webkit-scrollbar-thumb { background: rgba(212,168,83,0.15); border-radius: 99px; }
        .menu-danh-sach::-webkit-scrollbar-thumb:hover { background: #d4a853; }
        
        .alert { padding: 0.75rem 1.25rem; border-radius: 12px; font-size: 0.85rem; margin-bottom: 1rem; border: 1px solid transparent; animation: slideIn 0.3s ease; }
        .alert-success { background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.15); color: #4ade80; }
        .alert-error { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.15); color: #f87171; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        .empty-state { text-align: center; padding: 2.5rem 1.5rem; }
        .empty-icon { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }
        .text-nhat { color: #8b9ab8; font-size: 0.85rem; }
        .text-chinh { color: #d4a853; }
        .fw-bold { font-weight: 700; }

        .ambient-glow {
            position: fixed; border-radius: 50%;
            pointer-events: none; filter: blur(100px); z-index: 0;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex font-sans relative">

    <!-- AMBIENT GLOW: Hiệu ứng phát sáng nền -->
    <!-- Component: components/order/ambient_glow.html -->
    <div id="comp-ambient-glow"></div>

    <!-- SIDEBAR: Thanh điều hướng bên trái -->
    <!-- Component: components/shared/sidebar.html -->
    <div id="comp-sidebar"></div>

    <!-- MAIN CONTENT: Nội dung chính trang -->
    <div class="ml-sidebar-width flex-1 flex flex-col relative z-10">

        <!-- HEADER -->
        <!-- Component: components/order/header.html -->
        <div id="comp-header"></div>

        <main class="p-8 flex-1">
            <section id="trang-goimon" class="page active block">

                <!-- TIÊU ĐỀ TRANG -->
                <!-- Component: components/order/tieu_de.html -->
                <div id="comp-tieu-de"></div>

                <!-- THÔNG BÁO -->
                <!-- Component: components/order/thong_bao.html -->
                <div id="comp-thong-bao"></div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                    <!-- CỘT TRÁI -->
                    <div class="lg:col-span-7 space-y-6">

                        <!-- CHỌN BÀN (Bước 1) -->
                        <!-- Component: components/order/chon_ban.html -->
                        <div id="comp-chon-ban"></div>

                        <!-- GỌI MÓN (Bước 2) + FORM THÊM MÓN -->
                        <!-- Component: components/order/goi_mon.html (bao gồm form_them_mon bên trong) -->
                        <div id="comp-goi-mon"></div>

                    </div>

                    <!-- CỘT PHẢI: HÓA ĐƠN -->
                    <!-- Component: components/order/hoa_don.html -->
                    <div class="lg:col-span-5" id="comp-hoa-don-wrapper">
                        <div id="comp-hoa-don"></div>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="js/component_loader.js"></script>
    <script>
        // ============================================================
        // ORDER.HTML - Trang Gọi Món & POS
        // ============================================================
        (async function() {
            // 1. Tải sidebar
            await loadComponent('comp-sidebar', 'components/shared/sidebar.html');
            const sidebar = document.getElementById('mainSidebar');
            if (sidebar) sidebar.addEventListener('click', () => sidebar.classList.toggle('expanded'));
            initSidebarState();
            setActiveSidebarItem('order.html');

            // 2. Tải các component của trang order
            await loadComponent('comp-ambient-glow', 'components/order/ambient_glow.html');
            await loadComponent('comp-header', 'components/order/header.html');
            await loadComponent('comp-tieu-de', 'components/order/tieu_de.html');
            await loadComponent('comp-thong-bao', 'components/order/thong_bao.html');
            await loadComponent('comp-chon-ban', 'components/order/chon_ban.html');
            await loadComponent('comp-goi-mon', 'components/order/goi_mon.html');
            await loadComponent('comp-hoa-don', 'components/order/hoa_don.html');

            // 3. Tải JS logic của trang (order.js)
            await loadScript('js/order.js?v=2.0');
        })();
    </script>
</body>
</html>
