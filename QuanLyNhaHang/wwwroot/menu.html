<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vua Sư Tử - Thực Đơn</title>
    <!-- FAVICON: Thay đổi biểu tượng chương trình -->
    <link rel="icon" type="image/png" href="img/logo.png">
    <script>if(!sessionStorage.getItem('vst_logged_in')) window.location.href='login.html';</script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'sans-serif'],
                        heading: ['"Be Vietnam Pro"', 'sans-serif'],
                    },
                    colors: {
                        "primary": "#c0c1ff",
                        "surface": "#0b1326",
                        "surface-container": "#171f33",
                        "surface-container-highest": "#2d3449",
                        "on-surface": "#dae2fd",
                        "on-surface-variant": "#c7c4d7",
                        "background": "#0b1326",
                        "primary-container": "#8083ff",
                        "mau-xanh": "#2ecc71",
                        "mau-do": "#e74c3c"
                    },
                    spacing: {
                        "sidebar-width": "72px",
                        "container-padding": "32px",
                        "grid-gutter": "24px",
                    }
                }
            }
        };
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(192, 193, 255, 0.2);
        }
        .nav-btn.active {
            color: #c0c1ff;
            background: rgba(192, 193, 255, 0.1);
        }
        .nav-btn.active::after {
            content: '';
            position: absolute;
            left: 0;
            height: 32px;
            width: 4px;
            background: #c0c1ff;
            border-radius: 0 4px 4px 0;
        }
        /* Style spinner đẹp */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(192, 193, 255, 0.1);
            border-top-color: #c0c1ff;
            border-radius: 50%;
            margin: 2rem auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.6rem;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-thucan { background: rgba(192, 193, 255, 0.1); color: #c0c1ff; border: 1px solid rgba(192, 193, 255, 0.15); }
        .badge-nuocuong { background: rgba(52, 152, 219, 0.1); color: #3498db; border: 1px solid rgba(52, 152, 219, 0.15); }
        .badge-trong { background: rgba(46, 204, 113, 0.1); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.15); }
        .badge-cokhach { background: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.15); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            border-radius: 9999px;
            cursor: pointer;
        }
        .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.72rem; }
        .btn-primary { background: #c0c1ff; color: #0b1326; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #dae2fd; border: 1px solid rgba(255,255,255,0.08); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-danger { background: rgba(231,76,60,0.1); color: #e74c3c; border: 1px solid rgba(231,76,60,0.15); }
        .btn-danger:hover { background: #e74c3c; color: #fff; }
        .btn-info { background: rgba(192, 193, 255, 0.1); color: #c0c1ff; border: 1px solid rgba(192, 193, 255, 0.2); }
        .btn-info:hover { background: rgba(192, 193, 255, 0.2); }

        .alert {
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            font-size: 0.85rem;
            border: 1px solid transparent;
        }
        .alert-success { background: rgba(46,204,113,0.1); border-color: rgba(46,204,113,0.15); color: #2ecc71; }
        .alert-error { background: rgba(231,76,60,0.1); border-color: rgba(231,76,60,0.15); color: #e74c3c; }

        /* Modal Overlay CSS cho JS show/hide */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.show {
            display: flex;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex font-sans">

    <!-- SIDEBAR -->
    <nav class="fixed left-0 top-0 h-screen w-sidebar-width z-50 bg-surface-container border-r border-white/5 flex flex-col items-center py-8 gap-6">
        <img src="img/logo.png" alt="Logo" class="w-12 h-12 rounded-full border border-primary/30 object-cover shadow-[0_0_10px_rgba(192,193,255,0.2)]">
        
        <a href="index.html" class="nav-btn relative flex items-center justify-center w-12 h-12 rounded-xl text-on-surface-variant/60 hover:text-on-surface transition-all group" title="Sơ đồ bàn">
            <span class="material-symbols-outlined">layers</span>
        </a>

        <a href="menu.html" class="nav-btn active relative flex items-center justify-center w-12 h-12 rounded-xl text-on-surface-variant hover:text-on-surface transition-all group" title="Thực đơn">
            <span class="material-symbols-outlined">restaurant_menu</span>
        </a>

        <a href="order.html" class="nav-btn relative flex items-center justify-center w-12 h-12 rounded-xl text-on-surface-variant/60 hover:text-on-surface transition-all group" title="Gọi món">
            <span class="material-symbols-outlined">point_of_sale</span>
        </a>

        <a href="lichsu.html" class="nav-btn relative flex items-center justify-center w-12 h-12 rounded-xl text-on-surface-variant/60 hover:text-on-surface transition-all group" title="Lịch sử hóa đơn">
            <span class="material-symbols-outlined">receipt_long</span>
        </a>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="ml-sidebar-width flex-1 flex flex-col">
        <!-- HEADER -->
        <header class="sticky top-0 h-16 bg-surface/80 backdrop-blur-md border-b border-white/5 flex justify-between items-center px-8 z-40">
            <h1 class="text-xl font-semibold tracking-tight text-on-surface flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">restaurant_menu</span> Nhà Hàng Vua Sư Tử
            </h1>
            <div class="flex items-center gap-4">
                <div class="text-right mr-4">
                    <p class="text-xs text-on-surface-variant">Hệ thống quản lý</p>
                    <p class="text-sm font-semibold">Vua Sư Tử v1.0</p>
                </div>
                <div class="w-10 h-10 rounded-full overflow-hidden border border-white/10 bg-surface-container-highest flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-surface-variant">account_circle</span>
                </div>
            </div>
        </header>

        <main class="p-8 flex-1">
            <!-- PAGE: THỰC ĐƠN -->
            <section id="trang-thucdon" class="page active block">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 gap-4">
                    <div>
                        <h2 class="text-3xl font-bold mb-2 tracking-tight">Thực Đơn</h2>
                        <p class="text-on-surface-variant">Quản lý danh sách món ăn cao cấp của nhà hàng.</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="moModalThem()" class="bg-primary text-surface px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:opacity-90 active:scale-95 transition-all">
                            <span class="material-symbols-outlined">add</span> Thêm Món Mới
                        </button>
                        <button onclick="taiDanhSach()" class="glass-card text-on-surface px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-white/10 active:scale-95 transition-all">
                            <span class="material-symbols-outlined">refresh</span> Làm Mới
                        </button>
                    </div>
                </div>

                <!-- Khu vực thông báo -->
                <div id="thongBaoKhuVuc" class="mb-6"></div>

                <!-- Lọc & thống kê -->
                <div class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-surface-container border border-white/5 p-4 rounded-2xl mb-8">
                    <select id="cboLocLoai" class="bg-surface-container-highest border border-white/10 rounded-xl px-4 py-2 text-on-surface focus:border-primary focus:ring-0 outline-none transition-all text-xs font-semibold uppercase tracking-wider cursor-pointer" onchange="locTheoLoai()">
                        <option value="">Tất cả loại</option>
                        <option value="ThucAn">🍖 Thức ăn</option>
                        <option value="NuocUong">🥤 Nước uống</option>
                    </select>
                    
                    <div class="text-sm bg-white/5 px-4 py-2 rounded-xl border border-white/5">
                        <span class="text-on-surface-variant">Tổng số: <strong id="tongSoMon" class="text-primary font-bold text-sm">0</strong> món</span>
                    </div>
                    <div class="flex items-center gap-3 bg-white/5 px-3 py-2 rounded-xl border border-white/5 flex-1 max-w-xs">
                        <span class="material-symbols-outlined text-on-surface-variant text-sm">search</span>
                        <input type="text" id="txtTimKiemMon" class="bg-transparent border-none outline-none text-on-surface text-xs flex-1 placeholder:text-on-surface-variant/40" placeholder="Tìm kiếm món..." oninput="timKiemMon()">
                    </div>
                </div>

                <!-- Lưới món ăn -->
                <div id="bangSanPham" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <div class="col-span-full flex justify-center py-12">
                        <div class="spinner"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Thêm/Sửa Sản Phẩm -->
    <div class="modal-overlay" id="modalSanPham">
        <div class="glass-card bg-surface-container p-8 rounded-3xl w-full max-w-lg relative scale-95 transition-transform duration-300">
            <button onclick="dongModal('modalSanPham')" class="absolute top-4 right-4 text-on-surface-variant hover:text-on-surface">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h3 class="text-2xl font-bold mb-6 text-primary tracking-tight" id="modalSanPhamTieuDe">Thêm Món Mới</h3>

            <input type="hidden" id="txtIdSanPham">

            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Tên món <span class="text-mau-do">*</span></label>
                    <input type="text" id="txtTenSanPham" class="bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary focus:ring-0 outline-none transition-all placeholder:text-on-surface-variant/30 text-sm"
                           placeholder="VD: Lẩu Thái hải sản, Nước ép cam...">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Loại sản phẩm <span class="text-mau-do">*</span></label>
                    <select id="cboLoai" class="bg-surface-container-highest border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary focus:ring-0 outline-none transition-all text-sm cursor-pointer" onchange="capNhatGiaoDienLoai()">
                        <option value="ThucAn">🍖 Thức ăn</option>
                        <option value="NuocUong">🥤 Nước uống</option>
                    </select>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Giá cơ bản (VNĐ) <span class="text-mau-do">*</span></label>
                    <input type="number" id="txtGiaCoBan" class="bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary focus:ring-0 outline-none transition-all placeholder:text-on-surface-variant/30 text-sm"
                           placeholder="VD: 150000" min="0" step="1000">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Ảnh minh họa</label>
                    <div class="flex items-center gap-3">
                        <label class="flex items-center gap-2 bg-white/5 hover:bg-white/10 text-on-surface border border-white/10 px-4 py-2.5 rounded-xl text-sm font-bold cursor-pointer transition-all active:scale-[0.98]">
                            <span class="material-symbols-outlined text-[18px]">upload_file</span>
                            <span>Chọn từ máy tính...</span>
                            <input type="file" id="txtFileHinhAnh" accept="image/*" class="hidden" onchange="xuLyChonAnh(event)">
                        </label>
                        <button type="button" onclick="xoaAnhDaChon()" class="bg-white/5 hover:bg-mau-do/20 text-on-surface hover:text-mau-do border border-white/10 px-4 py-2.5 rounded-xl text-sm font-bold transition-all active:scale-[0.98]">
                            Xóa ảnh
                        </button>
                    </div>
                    <!-- Khung xem trước ảnh (Preview) -->
                    <div class="relative w-full h-32 rounded-xl bg-white/5 border border-white/10 overflow-hidden flex items-center justify-center mt-1">
                        <img id="imgPreviewHinhAnh" src="img/logo.png" alt="Xem trước" class="w-full h-full object-cover" onerror="this.src='img/logo.png'">
                    </div>
                    <!-- Lưu trữ chuỗi base64 ngầm -->
                    <input type="hidden" id="txtHinhAnh">
                </div>

                <!-- Ghi chú phụ phí theo loại (Đa hình OOP) -->
                <div id="ghiChuPhuPhi" class="bg-primary/5 border border-primary/10 rounded-xl p-4 shadow-sm">
                    <p class="text-xs text-on-surface-variant leading-relaxed">
                        <strong class="text-primary flex items-center gap-1 mb-1">
                            <span class="material-symbols-outlined text-[16px]">info</span> Đa hình OOP (Phụ phí tự động):
                        </strong>
                        <span id="moTaPhuPhi" class="text-on-surface font-medium italic"></span>
                    </p>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Trạng thái bán</label>
                    <select id="cboDangBan" class="bg-surface-container-highest border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary focus:ring-0 outline-none transition-all text-sm cursor-pointer">
                        <option value="true">✅ Đang phục vụ</option>
                        <option value="false">❌ Tạm ngừng</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3 pt-6 border-t border-white/5 mt-6">
                <button id="btnHuySanPham" onclick="dongModal('modalSanPham')" class="flex-1 glass-card text-on-surface py-3 rounded-xl font-bold hover:bg-white/10 transition-all">Hủy</button>
                <button id="btnLuuSanPham" onclick="luuSanPham()" class="flex-1 bg-primary text-surface py-3 rounded-xl font-bold hover:opacity-90 transition-all">Lưu</button>
            </div>
        </div>
    </div>

    <script src="js/menu.js?v=1.3"></script>
    <script>
        // Đồng bộ hiệu ứng mở/đóng modal mượt mà
        window.moModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.add('show');
                setTimeout(() => {
                    const child = modal.firstElementChild;
                    if (child) {
                        child.classList.remove('scale-95');
                        child.classList.add('scale-100');
                    }
                }, 50);
            }
        };

        window.dongModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) {
                const child = modal.firstElementChild;
                if (child) {
                    child.classList.remove('scale-100');
                    child.classList.add('scale-95');
                }
                setTimeout(() => {
                    modal.classList.remove('show');
                }, 150);
            }
        };
    </script>
</body>
</html>
