<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Đơn - Quản Lý Nhà Hàng</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="index.html" class="nav-logo">🍽️ Nhà Hàng</a>
        <div class="nav-links">
            <a href="index.html">🪑 <span>Quản Lý Bàn</span></a>
            <a href="menu.html" class="active">📋 <span>Thực Đơn</span></a>
            <a href="order.html">🛒 <span>Gọi Món</span></a>
            <a href="lichsu.html">📊 <span>Lịch Sử</span></a>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="page-title"><span>📋</span> Quản Lý Thực Đơn (Menu)</h1>

    <div id="thongBaoKhuVuc"></div>

    <!-- Toolbar -->
    <div class="card mb-2">
        <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="moModalThem()">
                ➕ Thêm Món Mới
            </button>
            <button class="btn btn-secondary" onclick="taiDanhSach()">
                🔄 Làm Mới
            </button>
            <!-- Lọc theo loại -->
            <select id="locLoai" class="form-control" style="width:auto;"
                    onchange="locTheoLoai()">
                <option value="">Tất cả loại</option>
                <option value="ThucAn">🍖 Thức ăn</option>
                <option value="NuocUong">🥤 Nước uống</option>
            </select>
            <div style="margin-left:auto; font-size:0.85rem; color:var(--mau-chu-nhat);">
                Tổng: <strong id="tongSoMon" style="color:var(--mau-chinh)">0</strong> món
            </div>
        </div>
    </div>

    <!-- Bảng sản phẩm -->
    <div class="card">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Tên Món</th>
                        <th>Loại</th>
                        <th>Giá Cơ Bản</th>
                        <th>Trạng Thái</th>
                        <th>Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="bangSanPham">
                    <tr>
                        <td colspan="6" class="text-center" style="padding:2rem;">
                            <div class="spinner"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Thêm/Sửa Sản Phẩm -->
<div class="modal-overlay" id="modalSanPham">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title" id="modalSanPhamTieuDe">Thêm Món Mới</h3>
            <button class="modal-close" onclick="dongModal('modalSanPham')">✕</button>
        </div>

        <input type="hidden" id="inputIdSanPham">

        <div class="form-group">
            <label class="form-label">Tên món <span style="color:var(--mau-do)">*</span></label>
            <input type="text" id="inputTenSanPham" class="form-control"
                   placeholder="VD: Lẩu Thái hải sản, Nước ép cam...">
        </div>

        <div class="form-group">
            <label class="form-label">Loại <span style="color:var(--mau-do)">*</span></label>
            <select id="selectLoai" class="form-control" onchange="capNhatGiaoDienLoai()">
                <option value="ThucAn">🍖 Thức ăn</option>
                <option value="NuocUong">🥤 Nước uống</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Giá cơ bản (VNĐ) <span style="color:var(--mau-do)">*</span></label>
            <input type="number" id="inputGiaCoBan" class="form-control"
                   placeholder="VD: 150000" min="0" step="1000">
        </div>

        <!-- Ghi chú phụ phí theo loại -->
        <div id="ghiChuPhuPhi" class="card" style="margin-bottom:1rem; border-color:rgba(245,166,35,0.2);">
            <p style="font-size:0.82rem; color:var(--mau-chu-nhat);">
                <strong style="color:var(--mau-chinh);">💡 Phụ phí tự động (Đa hình OOP):</strong><br>
                <span id="moTaPhuPhi"></span>
            </p>
        </div>

        <div class="form-group">
            <label class="form-label">Trạng thái</label>
            <select id="selectDangBan" class="form-control">
                <option value="true">✅ Đang phục vụ</option>
                <option value="false">❌ Tạm ngừng</option>
            </select>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="dongModal('modalSanPham')">Hủy</button>
            <button class="btn btn-primary" onclick="luuSanPham()">💾 Lưu</button>
        </div>
    </div>
</div>

<script src="js/menu.js"></script>
</body>
</html>
