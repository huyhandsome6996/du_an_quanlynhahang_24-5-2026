<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vua Sư Tử - Thực Đơn</title>
    <!-- FAVICON: Thay đổi biểu tượng chương trình -->
    <link rel="icon" type="image/png" href="img/logo.png">
    <script>if(!sessionStorage.getItem('vst_logged_in')) window.location.href='login.html';</script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        heading: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        "primary": "#d4a853",
                        "primary-soft": "#f0d68a",
                        "surface": "#0a1628",
                        "surface-container": "#101e35",
                        "surface-container-highest": "#1e3050",
                        "on-surface": "#e8ecf4",
                        "on-surface-variant": "#8b9ab8",
                        "background": "#0a1628",
                        "primary-container": "#c49a42",
                        "mau-xanh": "#4ade80",
                        "mau-do": "#f87171"
                    },
                    spacing: {
                        "sidebar-width": "76px",
                        "container-padding": "32px",
                        "grid-gutter": "24px",
                    }
                }
            }
        };
    </script>
    <style>
        /* Sidebar styles */
        .sidebar {
            background: linear-gradient(180deg, #0d1a30, #0a1628);
            border-right: 1px solid rgba(212, 168, 83, 0.08);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 76px;
            overflow: hidden;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }
        .sidebar.expanded { width: 240px; }
        .sidebar-text { display: none; white-space: nowrap; font-weight: 600; color: #e8ecf4; margin-left: 0.75rem; }
        .sidebar.expanded .sidebar-text { display: block; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-btn {
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            justify-content: flex-start;
            padding-left: 18px;
            width: 100%;
            height: 52px;
        }
        .nav-btn:hover { background: rgba(212, 168, 83, 0.08); }
        .nav-btn.active { color: #d4a853; background: rgba(212, 168, 83, 0.1); }
        .nav-btn.active::after {
            content: '';
            position: absolute;
            left: 0;
            height: 32px;
            width: 3px;
            background: linear-gradient(180deg, #d4a853, #f0d68a);
            border-radius: 0 4px 4px 0;
        }

        /* Glass card (True Liquid Glass) */
        .glass-card {
            background: linear-gradient(145deg, rgba(16, 30, 53, 0.7), rgba(10, 22, 40, 0.8));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 168, 83, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .glass-card:hover {
            background: linear-gradient(145deg, rgba(16, 30, 53, 0.8), rgba(10, 22, 40, 0.9));
            border-color: rgba(212, 168, 83, 0.25);
            box-shadow: 
                0 16px 40px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(212, 168, 83, 0.12);
            border-top-color: #d4a853;
            border-radius: 50%;
            margin: 2rem auto;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .badge {
            display: inline-flex; align-items: center;
            padding: 0.25rem 0.65rem; font-size: 0.72rem;
            font-weight: 600; border-radius: 9999px;
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .badge-thucan { background: rgba(212, 168, 83, 0.1); color: #d4a853; border: 1px solid rgba(212, 168, 83, 0.2); }
        .badge-nuocuong { background: rgba(96, 165, 250, 0.1); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.2); }
        .badge-trong { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.2); }
        .badge-cokhach { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 600; letter-spacing: 0.03em;
            transition: all 0.25s; border-radius: 12px;
            cursor: pointer; border: none;
        }
        .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.75rem; border-radius: 10px; }
        .btn-primary { background: linear-gradient(135deg, #d4a853, #f0d68a, #c49a42); color: #0a1628; box-shadow: 0 2px 12px rgba(212, 168, 83, 0.2); }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(212, 168, 83, 0.35); }
        .btn-secondary { background: rgba(255,255,255,0.04); color: #e8ecf4; border: 1px solid rgba(255,255,255,0.08); }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); }
        .btn-danger { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
        .btn-danger:hover { background: #f87171; color: #fff; }
        .btn-info { background: rgba(212, 168, 83, 0.1); color: #d4a853; border: 1px solid rgba(212, 168, 83, 0.2); }
        .btn-info:hover { background: rgba(212, 168, 83, 0.2); }

        .alert { padding: 0.85rem 1.25rem; border-radius: 12px; font-size: 0.85rem; border: 1px solid transparent; animation: slideIn 0.3s ease; }
        .alert-success { background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.15); color: #4ade80; }
        .alert-error { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.15); color: #f87171; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        .empty-state { text-align: center; padding: 3rem 1.5rem; }
        .empty-icon { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }

        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(5, 10, 20, 0.75);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            align-items: center; justify-content: center; padding: 1rem;
        }
        .modal-overlay.show { display: flex; }

        /* Product card hover glow */
        .product-card {
            position: relative;
            overflow: hidden;
        }
        .product-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 50%, rgba(10, 22, 40, 0.9));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .product-card:hover::after { opacity: 0; }

        .ambient-glow {
            position: fixed; border-radius: 50%;
            pointer-events: none; filter: blur(100px); z-index: 0;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex font-sans relative">

    <!-- AMBIENT GLOW -->
    <!-- Component: components/menu/ambient_glow.html -->
    <div id="comp-ambient-glow"></div>

    <!-- SIDEBAR -->
    <!-- Component: components/shared/sidebar.html -->
    <div id="comp-sidebar"></div>

    <!-- MAIN CONTENT -->
    <div class="ml-sidebar-width flex-1 flex flex-col relative z-10">

        <!-- HEADER -->
        <!-- Component: components/menu/header.html -->
        <div id="comp-header"></div>

        <main class="p-8 flex-1">
            <section id="trang-thucdon" class="page active block">

                <!-- TIÊU ĐỀ, BỘ LỌC & LƯỚI SẢN PHẨM -->
                <!-- Component: components/menu/tieu_de_va_loc.html -->
                <div id="comp-noi-dung"></div>

            </section>
        </main>
    </div>

    <!-- MODAL THÊM/SỬA SẢN PHẨM -->
    <!-- Component: components/menu/modal_san_pham.html -->
    <div id="comp-modal-san-pham"></div>

    <!-- SCRIPTS -->
    <script src="js/component_loader.js"></script>
    <script>
        // ============================================================
        // MENU.HTML - Trang Thực Đơn
        // ============================================================
        (async function() {
            // 1. Tải sidebar
            await loadComponent('comp-sidebar', 'components/shared/sidebar.html');
            const sidebar = document.getElementById('mainSidebar');
            if (sidebar) sidebar.addEventListener('click', () => sidebar.classList.toggle('expanded'));
            initSidebarState();
            setActiveSidebarItem('menu.html');

            // 2. Tải các component của trang menu
            await loadComponent('comp-ambient-glow', 'components/menu/ambient_glow.html');
            await loadComponent('comp-header', 'components/menu/header.html');
            await loadComponent('comp-noi-dung', 'components/menu/tieu_de_va_loc.html');
            await loadComponent('comp-modal-san-pham', 'components/menu/modal_san_pham.html');

            // 3. Tải JS logic của trang (menu.js)
            await loadScript('js/menu.js?v=2.0');
        })();
    </script>
</body>
</html>
