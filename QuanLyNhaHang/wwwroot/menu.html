<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vua Sư Tử - Thực Đơn</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <script>
        if (!sessionStorage.getItem('vst_logged_in')) window.location.href = 'login.html';
        if (sessionStorage.getItem('vst_role') !== 'QuanTri') window.location.href = 'index.html';
    </script>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#d4a853",
                        "primary-soft": "#f0d68a",
                        "surface": "#0a1628",
                        "surface-container": "#101e35",
                        "surface-container-highest": "#1e3050",
                        "on-surface": "#e8ecf4",
                        "on-surface-variant": "#8b9ab8",
                        "background": "#0a1628",
                        "mau-do": "#f87171"
                    },
                    spacing: { "sidebar-width": "76px" }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-background text-on-surface min-h-screen flex font-sans relative">

    <div class="toast-container" id="toastContainer"></div>

    <div class="ambient-glow w-[400px] h-[400px] bg-primary/5 top-0 right-0"></div>
    <div class="ambient-glow w-[300px] h-[300px] bg-primary/3 bottom-0 left-1/4"></div>

    <!-- SIDEBAR -->
    <!-- JS TƯƠNG TÁC: Div này được JS (sidebar.js) nhúng giao diện thanh menu bên trái vào -->
    <div id="sidebar"></div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="ml-sidebar-width flex-1 flex flex-col relative z-10">
        <header class="sticky top-0 h-16 bg-surface/85 backdrop-blur-xl border-b border-primary/5 flex justify-between items-center px-8 z-40">
            <h1 class="text-xl font-bold tracking-tight flex items-center gap-2.5" style="font-family:'Playfair Display',serif;">
                <img src="img/menu_book_3d.png" alt="Menu" class="w-6 h-6 object-cover rounded-md">
                <span class="text-primary">Vua Sư Tử</span>
                <span class="text-on-surface-variant/40 font-light">|</span>
                <span class="text-on-surface-variant text-sm font-normal">Thực Đơn</span>
            </h1>
            <div class="flex items-center gap-4">
                <div class="text-right mr-3">
                    <p class="text-[10px] font-bold text-primary/60 uppercase tracking-widest">Hệ thống</p>
                    <p class="text-xs font-semibold text-on-surface-variant">Vua Sư Tử v1.0</p>
                </div>
                <div class="w-10 h-10 rounded-xl overflow-hidden border border-primary/15 bg-surface-container-highest flex items-center justify-center">
                    <img src="img/user_3d.png" class="w-full h-full object-cover" alt="User">
                </div>
            </div>
        </header>

        <main class="p-8 flex-1" style="animation: slideUp 0.5s ease forwards">
            <section id="trang-thucdon" class="page active block">
                <!-- Tiêu đề + nút bấm -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 gap-4">
                    <div>
                        <h2 class="text-3xl font-bold mb-2 tracking-tight" style="font-family:'Playfair Display',serif;">Thực Đơn</h2>
                        <p class="text-on-surface-variant text-sm">Quản lý danh sách món ăn của nhà hàng.</p>
                    </div>
                    <div class="flex gap-3">
                        <!-- JS TƯƠNG TÁC: Sự kiện onclick gọi hàm moModalThem() trong file menu.js để mở popup thêm món -->
                        <button onclick="moModalThem()" class="btn btn-primary px-5 py-2.5 flex items-center gap-2 font-bold text-sm">
                            <img src="img/add_3d.png" alt="Add" class="w-5 h-5 object-cover rounded-md"> Thêm Món Mới
                        </button>
                        <!-- JS TƯƠNG TÁC: Sự kiện onclick gọi hàm taiDanhSach() để gọi API lấy lại dữ liệu mới nhất -->
                        <button onclick="taiDanhSach()" class="glass-card text-on-surface px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-white/10 transition-all text-sm cursor-pointer">
                            <img src="img/refresh_3d.png" alt="Refresh" class="w-5 h-5 object-cover rounded-md"> Làm Mới
                        </button>
                    </div>
                </div>

                <!-- JS TƯƠNG TÁC: Div có id="thongBaoKhuVuc" dùng để JS chèn các thông báo (toast) màu xanh/đỏ vào đây -->
                <div id="thongBaoKhuVuc" class="mb-6"></div>

                <!-- Bộ lọc + tìm kiếm -->
                <div class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-surface-container border border-primary/5 p-4 rounded-2xl mb-8">
                    <!-- JS TƯƠNG TÁC: Lấy id="cboLocLoai" để lọc và sự kiện onchange="locTheoLoai()" kích hoạt khi đổi loại -->
                    <select id="cboLocLoai"
                            class="bg-surface-container-highest border border-white/10 rounded-xl px-4 py-2 text-on-surface focus:border-primary outline-none text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onchange="locTheoLoai()">
                        <option value="">Tất cả loại</option>
                        <option value="ThucAn">🍖 Thức ăn</option>
                        <option value="NuocUong">🥤 Nước uống</option>
                    </select>

                    <div class="text-sm bg-white/[0.04] px-4 py-2 rounded-xl border border-primary/5">
                        <!-- JS TƯƠNG TÁC: JS cập nhật số lượng hiển thị vào thẻ có id="tongSoMon" này -->
                        <span class="text-on-surface-variant">Tổng số: <strong id="tongSoMon" class="text-primary font-bold">0</strong> món</span>
                    </div>

                    <div class="flex items-center gap-3 bg-white/[0.04] px-4 py-2 rounded-xl border border-primary/5 flex-1 max-w-xs focus-within:border-primary/20">
                        <img src="img/search_3d.png" alt="Search" class="w-4 h-4 object-cover rounded-sm opacity-70">
                        <!-- JS TƯƠNG TÁC: oninput="timKiemMon()" kích hoạt mỗi khi gõ phím. JS lấy giá trị qua id="txtTimKiemMon" -->
                        <input type="text" id="txtTimKiemMon"
                               class="bg-transparent border-none outline-none text-on-surface text-xs flex-1"
                               placeholder="Tìm món..." oninput="timKiemMon()">
                    </div>
                </div>

                <!-- Lưới món ăn -->
                <!-- JS TƯƠNG TÁC: Div id="bangSanPham" là nơi JS dùng vòng lặp render ra danh sách các thẻ HTML món ăn -->
                <div id="bangSanPham" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <div class="col-span-full flex justify-center py-12"><div class="spinner"></div></div>
                </div>
            </section>
        </main>
    </div>

    <!-- ========== MODAL: Thêm/Sửa Sản Phẩm ========== -->
    <!-- JS TƯƠNG TÁC: JS thao tác thêm class 'active' vào id="modalSanPham" để ẩn/hiện popup -->
    <div class="modal-overlay" id="modalSanPham">
        <div class="glass-card bg-surface-container p-8 rounded-3xl w-full max-w-lg relative scale-95 transition-transform duration-300 border border-primary/10">
            <!-- JS TƯƠNG TÁC: Gọi hàm dongModal('modalSanPham') để đóng popup -->
            <button onclick="dongModal('modalSanPham')" class="absolute top-4 right-4 hover:scale-110 transition-transform">
                <img src="img/close_3d.png" alt="Close" class="w-6 h-6 object-cover rounded-lg">
            </button>
            <h3 class="text-2xl font-bold mb-6 text-primary tracking-tight" style="font-family:'Playfair Display',serif;" id="modalSanPhamTieuDe">Thêm Món Mới</h3>

            <!-- JS TƯƠNG TÁC: JS lưu ngầm ID của món ăn đang sửa vào id="txtIdSanPham" -->
            <input type="hidden" id="txtIdSanPham">

            <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <!-- Tên món -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Tên món <span class="text-mau-do">*</span></label>
                    <!-- JS TƯƠNG TÁC: JS lấy và gán giá trị tên món qua id="txtTenSanPham" -->
                    <input type="text" id="txtTenSanPham"
                           class="bg-white/[0.04] border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary outline-none text-sm"
                           placeholder="VD: Lẩu Thái, Nước ép cam...">
                </div>

                <!-- Loại -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Loại <span class="text-mau-do">*</span></label>
                    <!-- JS TƯƠNG TÁC: id="cboLoai" để lấy giá trị. onchange gọi capNhatGiaoDienLoai() đổi chữ hiển thị phụ phí -->
                    <select id="cboLoai"
                            class="bg-surface-container-highest border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary outline-none text-sm cursor-pointer"
                            onchange="capNhatGiaoDienLoai()">
                        <option value="ThucAn">🍖 Thức ăn</option>
                        <option value="NuocUong">🥤 Nước uống</option>
                    </select>
                </div>

                <!-- Giá -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Giá cơ bản (VNĐ) <span class="text-mau-do">*</span></label>
                    <!-- JS TƯƠNG TÁC: JS lấy giá từ ô input có id="txtGiaCoBan" -->
                    <input type="number" id="txtGiaCoBan"
                           class="bg-white/[0.04] border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary outline-none text-sm"
                           placeholder="VD: 150000" min="0" step="1000">
                </div>

                <!-- Ảnh -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Ảnh minh họa</label>
                    <div class="flex items-center gap-3">
                        <label class="flex items-center gap-2 bg-white/[0.04] hover:bg-white/[0.08] text-on-surface border border-white/10 px-4 py-2.5 rounded-xl text-sm font-bold cursor-pointer transition-all">
                            <img src="img/upload_3d.png" alt="Upload" class="w-5 h-5 object-cover rounded-md">
                            <span>Chọn ảnh...</span>
                            <!-- JS TƯƠNG TÁC: Chọn file sẽ gọi xuLyChonAnh(event) để tải ảnh và hiển thị xem trước -->
                            <input type="file" id="txtFileHinhAnh" accept="image/*" class="hidden" onchange="xuLyChonAnh(event)">
                        </label>
                        <!-- JS TƯƠNG TÁC: Bấm nút này gọi xoaAnhDaChon() để hủy ảnh -->
                        <button type="button" onclick="xoaAnhDaChon()" class="bg-white/[0.04] hover:bg-mau-do/20 text-on-surface hover:text-mau-do border border-white/10 px-4 py-2.5 rounded-xl text-sm font-bold transition-all">
                            Xóa ảnh
                        </button>
                    </div>
                    <div class="relative w-full h-32 rounded-xl bg-white/[0.03] border border-primary/8 overflow-hidden flex items-center justify-center mt-1">
                        <!-- JS TƯƠNG TÁC: JS thay đổi thuộc tính src của thẻ img id="imgPreviewHinhAnh" này -->
                        <img id="imgPreviewHinhAnh" src="img/logo.png" alt="Preview" class="w-full h-full object-cover" onerror="this.src='img/logo.png'">
                    </div>
                    <!-- JS TƯƠNG TÁC: JS lưu dữ liệu base64 của ảnh vào id="txtHinhAnh" để gửi API -->
                    <input type="hidden" id="txtHinhAnh">
                </div>

                <!-- Ghi chú đa hình OOP (Phụ phí) -->
                <div class="bg-primary/[0.04] border border-primary/10 rounded-xl p-4">
                    <p class="text-xs text-on-surface-variant leading-relaxed">
                        <strong class="text-primary flex items-center gap-1 mb-1">
                            <img src="img/check_3d.png" alt="Info" class="w-4 h-4 object-cover rounded-sm"> Đa hình OOP (Phụ phí tự động):
                        </strong>
                        <!-- JS TƯƠNG TÁC: JS chèn text giải thích phụ phí (tùy Đồ ăn hay Thức uống) vào id="moTaPhuPhi" -->
                        <span id="moTaPhuPhi" class="text-on-surface font-medium italic"></span>
                    </p>
                </div>

                <!-- Trạng thái bán -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Trạng thái bán</label>
                    <!-- JS TƯƠNG TÁC: JS lấy lựa chọn (true/false) từ id="cboDangBan" -->
                    <select id="cboDangBan"
                            class="bg-surface-container-highest border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary outline-none text-sm cursor-pointer">
                        <option value="true">✅ Đang phục vụ</option>
                        <option value="false">❌ Tạm ngừng</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3 pt-6 border-t border-primary/5 mt-6">
                <!-- JS TƯƠNG TÁC: Nút đóng modal, không cần gọi API -->
                <button onclick="dongModal('modalSanPham')" class="flex-1 glass-card text-on-surface py-3 rounded-xl font-bold hover:bg-white/10 transition-all cursor-pointer">Hủy</button>
                <!-- JS TƯƠNG TÁC: Nút Lưu gọi hàm luuSanPham(), hàm này sẽ gom tất cả dữ liệu từ các thẻ input ở trên và gửi lên API -->
                <button onclick="luuSanPham()" class="flex-1 btn btn-primary py-3 rounded-xl font-bold">Lưu</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/common.js"></script>
    <script src="js/sidebar.js"></script>
    <script>chenSidebar('menu');</script>
    <script src="js/menu.js"></script>
</body>
</html>
