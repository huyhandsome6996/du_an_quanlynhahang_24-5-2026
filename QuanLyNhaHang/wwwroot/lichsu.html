<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vua Sư Tử - Lịch Sử Hóa Đơn</title>
    <!-- FAVICON: Thay đổi biểu tượng chương trình -->
    <link rel="icon" type="image/png" href="img/logo.png">
    <script>if(!sessionStorage.getItem('vst_logged_in')) window.location.href='login.html';</script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        heading: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        "primary": "#d4a853",
                        "primary-hover": "#c49a42",
                        "primary-soft": "#f0d68a",
                        "surface": "#0a1628",
                        "surface-container": "#101e35",
                        "surface-container-highest": "#1e3050",
                        "on-surface": "#e8ecf4",
                        "on-surface-variant": "#8b9ab8",
                        "background": "#060d1a"
                    },
                    spacing: {
                        "sidebar-width": "76px",
                    }
                }
            }
        };
    </script>
    <style>
        .sidebar {
            background: linear-gradient(180deg, #0d1a30, #0a1628);
            border-right: 1px solid rgba(212, 168, 83, 0.08);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 76px;
            overflow: hidden;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }
        .sidebar.expanded { width: 240px; }
        .sidebar-text { display: none; white-space: nowrap; font-weight: 600; color: #e8ecf4; margin-left: 0.75rem; }
        .sidebar.expanded .sidebar-text { display: block; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-btn {
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            justify-content: flex-start;
            padding-left: 18px;
            width: 100%;
            height: 52px;
        }
        .nav-btn:hover { background: rgba(212, 168, 83, 0.08); }

        .glass-card {
            background: linear-gradient(145deg, rgba(16, 30, 53, 0.7), rgba(10, 22, 40, 0.8));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 168, 83, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .glass-card:hover {
            background: linear-gradient(145deg, rgba(16, 30, 53, 0.8), rgba(10, 22, 40, 0.9));
            border-color: rgba(212, 168, 83, 0.25);
            box-shadow: 
                0 16px 40px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(212, 168, 83, 0.12);
            border-top-color: #d4a853;
            border-radius: 50%;
            margin: 2rem auto;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Badge States */
        .badge {
            display: inline-flex; align-items: center;
            padding: 0.25rem 0.65rem; font-size: 0.72rem;
            font-weight: 600; border-radius: 10px;
            letter-spacing: 0.02em;
        }
        .badge-dathanhtoan {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        .badge-chuathanhtoan {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        /* Glow orbs */
        .glow-orb-1 {
            filter: blur(100px);
            pointer-events: none;
        }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            align-items: center; justify-content: center;
            padding: 1rem;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.show { display: flex; opacity: 1; }

        /* Table */
        .table-wrapper {
            overflow-x: auto; border-radius: 14px;
            border: 1px solid rgba(212, 168, 83, 0.06);
            background: rgba(6, 13, 26, 0.4);
            margin-top: 1rem;
        }
        .table-wrapper table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        .table-wrapper th {
            padding: 1rem; background: rgba(16, 30, 53, 0.6);
            color: #d4a853; font-weight: 600; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(212, 168, 83, 0.08);
        }
        .table-wrapper td {
            padding: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.03); color: #e8ecf4;
        }

        /* Tong Tien Box */
        .tong-tien-box {
            margin-top: 1.5rem;
            background: linear-gradient(135deg, rgba(212, 168, 83, 0.06), rgba(212, 168, 83, 0.02));
            border: 1px solid rgba(212, 168, 83, 0.1);
            border-radius: 16px;
            padding: 1.25rem;
        }
        .tong-tien-row.tong {
            display: flex; justify-content: space-between;
            font-weight: 700; font-size: 1.1rem; color: #d4a853;
        }

        .alert {
            padding: 1rem 1.25rem; border-radius: 12px;
            font-size: 0.85rem; border: 1px solid transparent; text-align: center;
            animation: slideIn 0.3s ease;
        }
        .alert-error {
            background: rgba(248, 113, 113, 0.08);
            border-color: rgba(248, 113, 113, 0.15); color: #f87171;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        .text-nhat { color: #8b9ab8; font-size: 0.85rem; }
        .text-chinh { color: #d4a853; }
        .fw-bold { font-weight: 700; }
        .empty-state { text-align: center; padding: 3rem; color: #8b9ab8; }
        .empty-state .empty-icon { font-size: 3rem; display: block; margin-bottom: 0.75rem; opacity: 0.4; }

        .btn { display: inline-flex; align-items: center; justify-content: center; font-weight: 600; letter-spacing: 0.03em; transition: all 0.25s; border-radius: 12px; cursor: pointer; border: none; }
        .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.75rem; border-radius: 10px; }
        .btn-info { background: rgba(212, 168, 83, 0.1); color: #d4a853; border: 1px solid rgba(212, 168, 83, 0.2); }
        .btn-info:hover { background: rgba(212, 168, 83, 0.2); }
        
        /* CSS print */
        @media print {
            body * { visibility: hidden; }
            #modalChiTietHD, #modalChiTietHD * { visibility: visible; }
            #modalChiTietHD {
                position: absolute; left: 0; top: 0; width: 100%;
                background: white !important; color: black !important;
            }
            #modalChiTietHD .glass-card {
                background: white !important; color: black !important;
                border: none !important; box-shadow: none !important; backdrop-filter: none !important;
            }
            #modalChiTietHD button { display: none !important; }
            #modalChiTietHD th { color: black !important; background: #f3f4f6 !important; }
            #modalChiTietHD td { color: black !important; border-bottom: 1px solid #e5e7eb !important; }
            #modalChiTietHD .tong-tien-box { background: #f3f4f6 !important; color: black !important; border: 1px solid #e5e7eb !important; }
            #modalChiTietHD .tong-tien-row.tong { color: black !important; }
        }

        /* Stat widget icon animation */
        .stat-widget {
            position: relative;
            overflow: hidden;
        }
        .stat-widget::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(212, 168, 83, 0.03), transparent);
            border-radius: inherit;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex font-sans relative overflow-hidden">

    <!-- AMBIENT GLOW -->
    <!-- Component: components/lichsu/ambient_glow.html -->
    <div id="comp-ambient-glow"></div>

    <!-- SIDEBAR -->
    <!-- Component: components/shared/sidebar.html -->
    <div id="comp-sidebar"></div>

    <!-- MAIN CONTENT -->
    <div class="ml-sidebar-width flex-1 flex flex-col z-10 relative">

        <!-- HEADER -->
        <!-- Component: components/lichsu/header.html -->
        <div id="comp-header"></div>

        <main class="p-8 flex-1 max-w-7xl w-full mx-auto">
            <section id="trang-lichsu" class="page active block">

                <!-- NỘI DUNG CHÍNH: Tiêu đề + Widget thống kê + Bảng lịch sử -->
                <!-- Component: components/lichsu/noi_dung_chinh.html -->
                <div id="comp-noi-dung"></div>

            </section>
        </main>
    </div>

    <!-- MODAL CHI TIẾT HÓA ĐƠN -->
    <!-- Component: components/lichsu/modal_chi_tiet_hd.html -->
    <div id="comp-modal-chi-tiet"></div>

    <!-- SCRIPTS -->
    <script src="js/component_loader.js"></script>
    <script>
        // ============================================================
        // LICHSU.HTML - Trang Lịch Sử Hóa Đơn
        // ============================================================
        (async function() {
            // 1. Tải sidebar
            await loadComponent('comp-sidebar', 'components/shared/sidebar.html');
            const sidebar = document.getElementById('mainSidebar');
            if (sidebar) sidebar.addEventListener('click', () => sidebar.classList.toggle('expanded'));
            initSidebarState();
            setActiveSidebarItem('lichsu.html');

            // 2. Tải các component của trang lichsu
            await loadComponent('comp-ambient-glow', 'components/lichsu/ambient_glow.html');
            await loadComponent('comp-header', 'components/lichsu/header.html');
            await loadComponent('comp-noi-dung', 'components/lichsu/noi_dung_chinh.html');
            await loadComponent('comp-modal-chi-tiet', 'components/lichsu/modal_chi_tiet_hd.html');

            // 3. Tải JS logic của trang (lichsu.js)
            await loadScript('js/lichsu.js?v=2.0');
        })();
    </script>
</body>
</html>
