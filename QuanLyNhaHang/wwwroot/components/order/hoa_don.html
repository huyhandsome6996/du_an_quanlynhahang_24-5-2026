<!--
================================================================
THÀNH PHẦN: Khu Vực Hóa Đơn Hiện Tại (Cột phải)
================================================================
File gốc thuộc: order.html (cột phải)
Mô tả: Hiển thị hóa đơn của bàn đang chọn.

Cấu trúc HTML:
  <div id="khuVucHoaDon"> Container chính
    ├─ Header (tiêu đề + nút refresh)
    ├─ chuaChonBan: Thông báo khi chưa chọn bàn
    └─ danhSachMon: Container danh sách món (ẩn mặc định)
        ├─ bangChiTietHoaDon: Bảng chi tiết (JS render)
        ├─ Tổng thanh toán
        └─ Nút THANH TOÁN & ĐÓNG BÀN

JavaScript liên quan:
  - taiLaiHoaDon() → tải lại hóa đơn [order.js]
  - thanhToan() → thanh toán & đóng bàn [order.js]
  - capNhatHienThiThanhToan() → cập nhật tổng tiền [order.js]
================================================================
-->
<div class="glass-card bg-surface-container/60 rounded-2xl p-5 shadow-lg" id="khuVucHoaDon">
    <div class="flex justify-between items-center pb-3 mb-4 border-b border-primary/5">
        <h3 class="text-xs font-bold text-primary uppercase tracking-wider flex items-center gap-1.5">
            <img src="img/bill_3d.png" alt="Bill" class="w-5 h-5 object-cover rounded-sm"> Hóa Đơn Hiện Tại
        </h3>
        <button class="glass-card w-8 h-8 rounded-full flex items-center justify-center transition-all duration-200 border-none cursor-pointer" onclick="taiLaiHoaDon()">
            <img src="img/refresh_3d.png" alt="Refresh" class="w-5 h-5 object-cover rounded-sm">
        </button>
    </div>

    <div id="chuaChonBan" class="flex flex-col items-center justify-center py-16 text-center text-on-surface-variant">
        <img src="img/table_3d.png" alt="Table" class="w-16 h-16 object-cover rounded-xl opacity-30 mb-2">
        <p class="text-sm">Hãy chọn bàn ở cột bên trái để quản lý hoặc thanh toán.</p>
    </div>

    <div id="danhSachMon" class="space-y-4" style="display:none;">
        <div id="bangChiTietHoaDon" class="max-h-[350px] overflow-y-auto"></div>

        <div class="bg-primary/[0.04] border border-primary/10 rounded-xl p-4 flex justify-between items-center shadow-inner">
            <span class="text-xs font-bold uppercase tracking-wider text-on-surface-variant flex items-center gap-1">
                <img src="img/money_3d.png" alt="Money" class="w-5 h-5 object-cover rounded-sm"> Tổng thanh toán:
            </span>
            <span id="tongTienHienThi" class="text-xl font-bold text-primary">0 ₫</span>
        </div>

        <div class="pt-2">
            <button class="btn-success flex items-center justify-center gap-2 active:scale-[0.98] shadow-md py-3 font-bold border-none cursor-pointer" onclick="thanhToan()" id="btnThanhToan">
                <img src="img/check_3d.png" alt="Check" class="w-5 h-5 object-cover rounded-sm"> THANH TOÁN & ĐÓNG BÀN
            </button>
        </div>
    </div>
</div>
