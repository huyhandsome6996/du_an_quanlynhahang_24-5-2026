<!--
================================================================
THÀNH PHẦN: Modal Chi Tiết Hóa Đơn
================================================================
File gốc thuộc: lichsu.html
Mô tả: Popup hiển thị chi tiết hóa đơn đã thanh toán.
       Có nút In Hóa Đơn (sử dụng CSS print).

Cấu trúc HTML:
  <div id="modalChiTietHD"> Modal overlay
    └─ chiTietHDTieuDe: Tiêu đề
    └─ chiTietHDNoidung: Nội dung (JS render)
    └─ Nút Đóng + In Hóa Đơn

JavaScript liên quan:
  - moChiTietHD(id) → mở + render chi tiết [lichsu.js]
  - dongModal('modalChiTietHD') → đóng [component_loader.js]
  - inHoaDon() → in hóa đơn (window.print) [lichsu.js]
================================================================
-->
<div class="modal-overlay" id="modalChiTietHD">
    <div class="glass-card bg-surface-container/90 border border-primary/10 p-8 rounded-3xl w-full max-w-2xl relative scale-95 transition-all duration-300 shadow-2xl">
        <button onclick="dongModal('modalChiTietHD')" class="absolute top-5 right-5 text-on-surface-variant hover:text-on-surface transition-all">
            <img src="img/close_3d.png" alt="Close" class="w-7 h-7 object-cover rounded-lg hover:scale-110 transition-transform">
        </button>
        <h3 class="font-heading text-2xl font-extrabold mb-6 text-primary flex items-center gap-2 tracking-tight" id="chiTietHDTieuDe">
            <img src="img/bill_3d.png" alt="Receipt" class="w-8 h-8 object-cover rounded-lg shadow-sm"> Chi Tiết Hóa Đơn
        </h3>
        
        <div class="max-h-[55vh] overflow-y-auto pr-2" id="chiTietHDNoidung"></div>
        
        <div class="flex justify-end gap-3 pt-6 border-t border-primary/5 mt-6">
            <button onclick="dongModal('modalChiTietHD')" class="bg-white/[0.04] hover:bg-white/[0.08] border border-white/8 text-on-surface px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider transition-all active:scale-[0.98] cursor-pointer">Đóng</button>
            <button class="bg-gradient-to-r from-primary to-primary-soft hover:from-primary-hover hover:to-primary text-surface px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-1 shadow-lg shadow-primary/10 active:scale-[0.98] cursor-pointer border-none" onclick="inHoaDon()">
                <img src="img/print_3d.png" alt="Print" class="w-5 h-5 object-cover rounded-sm"> In Hóa Đơn
            </button>
        </div>
    </div>
</div>
