<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vua Sư Tử - Bếp</title>
    <!-- FAVICON: Thay đổi biểu tượng chương trình -->
    <link rel="icon" type="image/png" href="img/logo.png">
    <script>if(!sessionStorage.getItem('vst_logged_in')) window.location.href='login.html';</script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        heading: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        "primary": "#d4a853",
                        "primary-soft": "#f0d68a",
                        "surface": "#0a1628",
                        "surface-container": "#101e35",
                        "surface-container-highest": "#1e3050",
                        "on-surface": "#e8ecf4",
                        "on-surface-variant": "#8b9ab8",
                        "background": "#0a1628",
                        "primary-container": "#c49a42",
                        "mau-xanh": "#4ade80",
                        "mau-do": "#f87171"
                    },
                    spacing: {
                        "sidebar-width": "76px",
                        "container-padding": "32px",
                        "grid-gutter": "24px",
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Card đơn đang chờ — viền amber pulse */
        .card-dangcho {
            border-left: 3px solid #f59e0b;
            animation: pulseAmber 2s ease-in-out infinite;
        }
        @keyframes pulseAmber {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.15); }
            50% { box-shadow: 0 0 12px 2px rgba(245, 158, 11, 0.10); }
        }

        /* Card đang chế biến — viền cyan */
        .card-dangchuanbi {
            border-left: 3px solid #22d3ee;
        }

        /* Badge đếm trên tiêu đề cột */
        .count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            padding: 0 7px;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        /* Danh sách cuộn trong cột */
        .danh-sach-bep {
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            padding-right: 4px;
        }
        .danh-sach-bep::-webkit-scrollbar { width: 5px; }
        .danh-sach-bep::-webkit-scrollbar-track { background: transparent; }
        .danh-sach-bep::-webkit-scrollbar-thumb { background: rgba(212, 168, 83, 0.15); border-radius: 99px; }
        .danh-sach-bep::-webkit-scrollbar-thumb:hover { background: #d4a853; }
    </style>
</head>
<body class="bg-[#0a1628] text-on-surface min-h-screen flex font-sans relative">

    <div class="toast-container" id="toastContainer"></div>

    <div class="ambient-glow w-[400px] h-[400px] bg-primary/5 top-0 right-0"></div>
    <div class="ambient-glow w-[300px] h-[300px] bg-primary/3 bottom-0 left-1/4"></div>

    <!-- SIDEBAR -->
    <nav class="sidebar fixed left-0 top-0 h-screen z-50 flex flex-col py-6" id="mainSidebar">
        <script>
            if (sessionStorage.getItem('sidebarExpanded') === 'true') {
                document.getElementById('mainSidebar').classList.add('expanded');
            }
        </script>
        <!-- Logo with gold ring -->
        <div class="relative group mb-6 px-3 w-full flex justify-center">
            <div class="absolute inset-0 rounded-full bg-primary/15 blur-md pointer-events-none transition-all group-hover:bg-primary/25"></div>
            <img src="img/logo.png" alt="Logo" class="relative w-12 h-12 rounded-full border-2 border-primary/30 object-cover shadow-[0_0_15px_rgba(212,168,83,0.2)] transition-all group-hover:scale-105 shrink-0">
            <span class="sidebar-text text-primary font-heading text-xl mt-2">Vua Sư Tử</span>
        </div>
        
        <!-- Decorative line -->
        <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-primary/20 to-transparent mb-4"></div>
        
        <a href="index.html" class="nav-btn relative flex items-center group text-on-surface-variant/50 hover:text-on-surface transition-all" title="Sơ đồ bàn">
            <img src="img/table_3d.png" alt="Bàn" class="w-9 h-9 object-cover rounded-[14px] bg-white/[0.04] border border-primary/20 p-1 group-hover:scale-110 transition-transform shadow-sm shrink-0">
            <span class="sidebar-text text-sm">Sơ đồ bàn</span>
        </a>

        <a href="menu.html" class="nav-btn relative flex items-center group text-on-surface-variant/50 hover:text-on-surface transition-all" title="Thực đơn">
            <img src="img/menu_book_3d.png" alt="Thực đơn" class="w-9 h-9 object-cover rounded-[14px] bg-white/[0.04] border border-primary/20 p-1 group-hover:scale-110 transition-transform shadow-sm shrink-0">
            <span class="sidebar-text text-sm">Thực đơn</span>
        </a>

        <a href="order.html" class="nav-btn relative flex items-center group text-on-surface-variant/50 hover:text-on-surface transition-all" title="Gọi món">
            <img src="img/pos_3d.png" alt="POS" class="w-9 h-9 object-cover rounded-[14px] bg-white/[0.04] border border-primary/20 p-1 group-hover:scale-110 transition-transform shadow-sm shrink-0">
            <span class="sidebar-text text-sm">Gọi món</span>
        </a>

        <a href="lichsu.html" class="nav-btn relative flex items-center group text-on-surface-variant/50 hover:text-on-surface transition-all" title="Lịch sử hóa đơn">
            <img src="img/bill_3d.png" alt="Lịch sử" class="w-9 h-9 object-cover rounded-[14px] bg-white/[0.04] border border-primary/20 p-1 group-hover:scale-110 transition-transform shadow-sm shrink-0">
            <span class="sidebar-text text-sm">Lịch sử hóa đơn</span>
        </a>

        <a href="kho.html" class="nav-btn relative flex items-center group text-on-surface-variant/50 hover:text-on-surface transition-all" title="Quản lý Kho">
            <img src="img/refresh_3d.png" alt="Kho" class="w-9 h-9 object-cover rounded-[14px] bg-white/[0.04] border border-primary/20 p-1 group-hover:scale-110 transition-transform shadow-sm shrink-0">
            <span class="sidebar-text text-sm">Quản lý Kho</span>
        </a>

        <a href="bep.html" class="nav-btn active relative flex items-center group" title="Bếp">
            <img src="img/logo.png" alt="Bếp" class="w-9 h-9 object-cover rounded-[14px] bg-white/[0.04] border border-primary/20 p-1 group-hover:scale-110 transition-transform shadow-sm shrink-0">
            <span class="sidebar-text text-sm">Bếp</span>
        </a>

        <a href="baocao.html" class="nav-btn relative flex items-center group text-on-surface-variant/50 hover:text-on-surface transition-all" title="Báo cáo">
            <img src="img/money_3d.png" alt="Báo cáo" class="w-9 h-9 object-cover rounded-[14px] bg-white/[0.04] border border-primary/20 p-1 group-hover:scale-110 transition-transform shadow-sm shrink-0">
            <span class="sidebar-text text-sm">Báo cáo</span>
        </a>

        <!-- Spacer + Logout ở cuối -->
        <div class="flex-1"></div>
        <button onclick="event.stopPropagation(); sessionStorage.clear(); window.location.href='login.html';" class="nav-btn relative flex items-center group text-on-surface-variant/40 hover:text-mau-do transition-all" title="Đăng xuất">
            <img src="img/logout_3d.png" alt="Đăng xuất" class="w-9 h-9 object-cover rounded-[14px] bg-red-500/10 border border-red-500/20 p-1 group-hover:scale-110 transition-transform shadow-sm shrink-0">
            <span class="sidebar-text text-sm text-red-500">Đăng xuất</span>
        </button>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="ml-sidebar-width flex-1 flex flex-col relative z-10">
        <!-- HEADER -->
        <header class="sticky top-0 h-16 bg-surface/85 backdrop-blur-xl border-b border-primary/5 flex justify-between items-center px-8 z-40">
            <h1 class="font-heading text-xl font-bold tracking-tight text-on-surface flex items-center gap-2.5">
                <img src="img/logo.png" alt="Bếp" class="w-6 h-6 object-cover rounded-md">
                <span class="text-primary">Vua Sư Tử</span>
                <span class="text-on-surface-variant/40 font-light">|</span>
                <span class="text-on-surface-variant text-sm font-normal">Bếp</span>
            </h1>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-white/[0.04] border border-white/8 px-3 py-1.5 rounded-xl">
                    <span class="w-2 h-2 rounded-full bg-mau-xanh animate-pulse"></span>
                    <span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Tự động làm mới 5s</span>
                </div>
                <div class="text-right mr-3">
                    <p class="text-[10px] font-bold text-primary/60 uppercase tracking-widest">Hệ thống quản lý</p>
                    <p class="text-xs font-semibold text-on-surface-variant">Vua Sư Tử v2.0</p>
                </div>
                <div class="w-10 h-10 rounded-xl overflow-hidden border border-primary/15 bg-surface-container-highest flex items-center justify-center shadow-inner">
                    <img src="img/user_3d.png" class="w-full h-full object-cover" alt="User">
                </div>
            </div>
        </header>

        <main class="p-8 flex-1" style="animation: slideUp 0.5s ease forwards">
            <section id="trang-bep" class="page active block">
                <!-- Tiêu đề trang -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 gap-4 border-b border-primary/5 pb-4">
                    <div>
                        <h2 class="font-heading text-3xl font-bold mb-2 tracking-tight text-on-surface">Màn Hình Bếp</h2>
                        <p class="text-on-surface-variant text-sm">Quản lý món ăn đang chờ và đang chế biến theo thời gian thực.</p>
                    </div>
                    <button class="glass-card text-on-surface px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-white/10 active:scale-95 transition-all text-sm border-none cursor-pointer" onclick="taiTatCa()">
                        <img src="img/refresh_3d.png" alt="Refresh" class="w-5 h-5 object-cover rounded-md shadow-sm"> Làm Mới Ngay
                    </button>
                </div>

                <!-- Khu vực thông báo nội tuyến -->
                <div id="thongBaoKhuVuc" class="mb-6"></div>

                <!-- Hai cột chính -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">

                    <!-- CỘT TRÁI: Đơn đang chờ -->
                    <div>
                        <div class="glass-card bg-surface-container/60 rounded-2xl p-5 shadow-lg relative overflow-hidden">
                            <!-- Đường vàng trên đầu card -->
                            <div class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-transparent via-amber-500 to-transparent"></div>

                            <div class="flex justify-between items-center mb-5">
                                <h3 class="text-xs font-bold uppercase tracking-wider flex items-center gap-2">
                                    <span class="w-7 h-7 rounded-lg bg-amber-500/15 border border-amber-500/25 flex items-center justify-center text-sm">⏳</span>
                                    <span class="text-amber-400">Đơn đang chờ</span>
                                    <span class="count-badge bg-amber-500/15 text-amber-400 border border-amber-500/25" id="badgeDangCho">0</span>
                                </h3>
                            </div>

                            <div id="danhSachDangCho" class="danh-sach-bep space-y-4">
                                <!-- Spinner khi đang tải -->
                                <div class="flex justify-center py-12">
                                    <div class="spinner"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- CỘT PHẢI: Đang chế biến -->
                    <div>
                        <div class="glass-card bg-surface-container/60 rounded-2xl p-5 shadow-lg relative overflow-hidden">
                            <!-- Đường cyan trên đầu card -->
                            <div class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-transparent via-cyan-400 to-transparent"></div>

                            <div class="flex justify-between items-center mb-5">
                                <h3 class="text-xs font-bold uppercase tracking-wider flex items-center gap-2">
                                    <span class="w-7 h-7 rounded-lg bg-cyan-500/15 border border-cyan-500/25 flex items-center justify-center text-sm">🍳</span>
                                    <span class="text-cyan-400">Đang chế biến</span>
                                    <span class="count-badge bg-cyan-500/15 text-cyan-400 border border-cyan-500/25" id="badgeDangChuanBi">0</span>
                                </h3>
                            </div>

                            <div id="danhSachDangChuanBi" class="danh-sach-bep space-y-4">
                                <!-- Spinner khi đang tải -->
                                <div class="flex justify-center py-12">
                                    <div class="spinner"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/bep.js?v=2.0"></script>
</body>
</html>
