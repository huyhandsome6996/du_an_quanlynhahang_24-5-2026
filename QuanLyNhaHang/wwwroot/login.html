<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng nhập - Vua Sư Tử</title>
    <!-- Biểu tượng chương trình (thay icon mặc định WinForm) -->
    <link rel="icon" type="image/png" href="img/logo.png">

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Trang đăng nhập dùng riêng — chỉ style login-card */
        body {
            background: var(--mau-nen);
            background-image:
                radial-gradient(ellipse at top left,    rgba(212,168,83,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(212,168,83,0.04) 0%, transparent 50%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: linear-gradient(145deg, rgba(16,30,53,0.75), rgba(10,22,40,0.9));
            backdrop-filter: blur(32px);
            border: 1px solid rgba(212,168,83,0.15);
            box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,168,83,0.08);
            animation: cardAppear 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)    scale(1); }
        }
        .login-card:hover { box-shadow: 0 32px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(212,168,83,0.12); }

        /* Nút vàng chủ đạo */
        .btn-gold {
            background: linear-gradient(135deg, var(--mau-chinh), var(--mau-chinh-mem), var(--mau-chinh-dam));
            color: var(--mau-nen);
            transition: all 0.25s ease;
        }
        .btn-gold:hover { box-shadow: 0 6px 28px rgba(212,168,83,0.35); transform: translateY(-1px); }

        /* Input focus có viền vàng */
        .premium-input {
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            box-shadow: 0 0 24px rgba(212,168,83,0.2), 0 0 0 3px rgba(212,168,83,0.12);
            border-color: var(--mau-chinh) !important;
        }

        /* Logo phát sáng nhẹ */
        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(212,168,83,0.2); }
            50%      { box-shadow: 0 0 35px rgba(212,168,83,0.35); }
        }
        .logo-glow { animation: logoGlow 3s ease-in-out infinite; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-6px); }
            75%      { transform: translateX(6px); }
        }
    </style>
</head>

<body class="font-sans relative overflow-hidden">

    <!-- Quả cầu phát sáng nền (trang trí nhẹ) -->
    <div class="absolute -top-40 -left-40 w-[400px] h-[400px] rounded-full bg-primary/15 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-[500px] h-[500px] rounded-full bg-primary/8 blur-3xl pointer-events-none"></div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===================== LOGIN CARD ===================== -->
    <div class="login-card w-full max-w-md p-8 rounded-3xl mx-4 relative">
        <!-- Viền vàng trên cùng -->
        <div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-primary/20 via-primary to-primary/20 rounded-t-3xl"></div>

        <!-- Tiêu đề + Logo -->
        <div class="text-center mb-8">
            <div class="relative w-28 h-28 mx-auto mb-5">
                <div class="absolute inset-0 rounded-full bg-primary/15 blur-lg"></div>
                <img src="img/logo.png" alt="Logo Vua Sư Tử"
                     class="relative w-28 h-28 mx-auto rounded-full border-2 border-primary/40 object-cover logo-glow">
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-primary" style="font-family:'Playfair Display',serif;">
                NHÀ HÀNG VUA SƯ TỬ
            </h1>
            <p class="text-sm mt-2 font-medium tracking-[0.2em] uppercase" style="color:var(--mau-chu-nhat);"
               id="subtitleText">HỆ THỐNG QUẢN LÝ</p>
        </div>

        <!-- ============ FORM ĐĂNG KÝ (lần đầu chạy app) ============ -->
        <!-- JS TƯƠNG TÁC: Khi nhấn Submit form đăng ký, gọi hàm xuLyDangKy() để gửi API -->
        <form id="registerForm" class="space-y-5 hidden" onsubmit="xuLyDangKy(event)">
            <div class="p-3.5 rounded-xl bg-primary/5 border border-primary/15 text-primary text-sm text-center font-medium">
                👋 Chào mừng! Vui lòng tạo tài khoản quản trị đầu tiên để bắt đầu.
            </div>

            <!-- Tên đăng nhập -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider" style="color:var(--mau-chu-nhat);">Tên tài khoản</label>
                <!-- JS TƯƠNG TÁC: Lấy giá trị tên đăng ký từ id="txtRegUser" -->
                <input type="text" id="txtRegUser" required
                       class="premium-input w-full bg-white/[0.04] border border-white/10 rounded-2xl px-4 py-3.5 outline-none text-sm font-medium"
                       style="color:var(--mau-chu);"
                       placeholder="Tối thiểu 3 ký tự">
            </div>

            <!-- Mật khẩu -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider" style="color:var(--mau-chu-nhat);">Mật khẩu</label>
                <!-- JS TƯƠNG TÁC: Lấy mật khẩu đăng ký từ id="txtRegPass" -->
                <input type="password" id="txtRegPass" required
                       class="premium-input w-full bg-white/[0.04] border border-white/10 rounded-2xl px-4 py-3.5 outline-none text-sm font-medium"
                       style="color:var(--mau-chu);"
                       placeholder="Tối thiểu 4 ký tự">
            </div>

            <!-- Thông báo lỗi -->
            <div id="regErrorMsg" class="hidden text-red-400 text-xs text-center bg-red-500/8 border border-red-500/15 py-2.5 rounded-xl">
                <span id="regErrorText">Lỗi!</span>
            </div>

            <button type="submit" class="btn-gold w-full font-bold rounded-2xl py-4 uppercase text-xs tracking-widest">
                Thiết Lập Tài Khoản
            </button>

            <p class="text-center text-xs" style="color:var(--mau-chu-nhat);">
                Đã có tài khoản?
                <!-- JS TƯƠNG TÁC: Chuyển sang form Đăng nhập -->
                <a href="#" onclick="chuyenForm('login'); return false;" class="text-primary font-bold">Đăng nhập ngay</a>
            </p>
        </form>

        <!-- ============ FORM ĐĂNG NHẬP ============ -->
        <!-- JS TƯƠNG TÁC: Khi nhấn Đăng nhập, gọi hàm xuLyDangNhap() -->
        <form id="loginForm" class="space-y-5 hidden" onsubmit="xuLyDangNhap(event)">
            <!-- Tên đăng nhập -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider" style="color:var(--mau-chu-nhat);">Tên tài khoản</label>
                <input type="text" id="txtLogUser" required
                       class="premium-input w-full bg-white/[0.04] border border-white/10 rounded-2xl px-4 py-3.5 outline-none text-sm font-medium"
                       style="color:var(--mau-chu);"
                       placeholder="Nhập tài khoản">
            </div>

            <!-- Mật khẩu -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider" style="color:var(--mau-chu-nhat);">Mật khẩu</label>
                <!-- JS TƯƠNG TÁC: Lấy mật khẩu đăng nhập từ id="txtLogPass" -->
                <input type="password" id="txtLogPass" required
                       class="premium-input w-full bg-white/[0.04] border border-white/10 rounded-2xl px-4 py-3.5 outline-none text-sm font-medium"
                       style="color:var(--mau-chu);"
                       placeholder="••••••••">
            </div>

            <!-- Thông báo lỗi -->
            <div id="errorMsg" class="hidden text-red-400 text-xs text-center bg-red-500/8 border border-red-500/15 py-2.5 rounded-xl">
                <span id="errorText">Sai tài khoản hoặc mật khẩu!</span>
            </div>

            <button type="submit" class="btn-gold w-full font-bold rounded-2xl py-4 uppercase text-xs tracking-widest">
                Đăng Nhập
            </button>

            <p class="text-center text-xs" style="color:var(--mau-chu-nhat);">
                Chưa có tài khoản?
                <!-- JS TƯƠNG TÁC: Chuyển sang form Đăng ký -->
                <a href="#" onclick="chuyenForm('register'); return false;" class="text-primary font-bold">Tạo tài khoản mới</a>
            </p>
        </form>
    </div>

    <script>
        // ====== CẤU HÌNH API ======
        const API = 'http://localhost:5000/api';

        // ====== KHI TRANG VỪA TẢI: kiểm tra đã có user chưa ======
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API}/auth/check`);
                const data = await res.json();
                if (!data.coNguoiDung) {
                    // Chưa có user → hiện form đăng ký
                    document.getElementById('registerForm').classList.remove('hidden');
                    document.getElementById('subtitleText').textContent = "THIẾT LẬP TÀI KHOẢN QUẢN TRỊ";
                } else {
                    // Đã có user → hiện form đăng nhập
                    document.getElementById('loginForm').classList.remove('hidden');
                    document.getElementById('subtitleText').textContent = "VUI LÒNG ĐĂNG NHẬP";
                }
            } catch {
                // Server chưa sẵn sàng → mặc định hiện form đăng ký
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('subtitleText').textContent = "THIẾT LẬP TÀI KHOẢN QUẢN TRỊ";
            }
        });

        // ====== CHUYỂN QAY ĐỔI FORM ======
        function chuyenForm(formName) {
            if (formName === 'login') {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('subtitleText').textContent = "VUI LÒNG ĐĂNG NHẬP";
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('subtitleText').textContent = "TẠO TÀI KHOẢN MỚI";
            }
        }

        // ====== ĐĂNG KÝ ======
        async function xuLyDangKy(e) {
            e.preventDefault();
            const u = document.getElementById('txtRegUser').value.trim();
            const p = document.getElementById('txtRegPass').value.trim();

            // Validate phía client
            if (u.length < 3) return hienLoiDangKy('Tên đăng nhập phải có ít nhất 3 ký tự!');
            if (p.length < 4) return hienLoiDangKy('Mật khẩu phải có ít nhất 4 ký tự!');

            try {
                const res = await fetch(`${API}/auth/dangky`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ TenDangNhap: u, MatKhau: p })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("✅ " + data.thongBao);
                    window.location.reload();
                } else {
                    hienLoiDangKy(data.thongBao || 'Lỗi đăng ký!');
                }
            } catch {
                hienLoiDangKy('Không kết nối được server! Hãy chạy dotnet run trước.');
            }
        }

        function hienLoiDangKy(msg) {
            document.getElementById('regErrorText').textContent = msg;
            document.getElementById('regErrorMsg').classList.remove('hidden');
            // Hiệu ứng lắc nhẹ
            const card = document.querySelector('.login-card');
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'shake 0.4s ease-in-out';
        }

        // ====== ĐĂNG NHẬP ======
        // TƯƠNG TÁC: Hàm này chạy khi người dùng bấm nút "Đăng nhập" trên màn hình
        async function xuLyDangNhap(e) {
            // TƯƠNG TÁC: Chặn trình duyệt tự động tải lại trang khi gửi biểu mẫu (submit)
            e.preventDefault();
            
            // TƯƠNG TÁC: Lấy chữ từ 2 ô nhập liệu trên giao diện và cắt bỏ dấu cách thừa ở hai đầu
            const u = document.getElementById('txtLogUser').value.trim();
            const p = document.getElementById('txtLogPass').value.trim();

            // TƯƠNG TÁC: Kiểm tra nếu chưa nhập đủ thì dừng lại và hiện thông báo lỗi
            if (!u || !p) return hienLoiDangNhap('Vui lòng nhập đầy đủ thông tin!');

            try {
                // TƯƠNG TÁC: Dùng lệnh fetch đóng gói Tên đăng nhập + Mật khẩu thành gói dữ liệu JSON
                // và ném sang Hệ thống xử lý (Backend C#) tại đường dẫn "/api/auth/dangnhap"
                const res = await fetch(`${API}/auth/dangnhap`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ TenDangNhap: u, MatKhau: p })
                });

                // TƯƠNG TÁC: Nếu C# trả về thành công (Mã 200) nghĩa là CSDL xác nhận đúng người
                if (res.ok) {
                    const data = await res.json(); // Lấy data chứa VaiTro từ C# trả về
                    // TƯƠNG TÁC: Lưu thẻ thông hành vào bộ nhớ trình duyệt để hệ thống nhớ là đã đăng nhập
                    sessionStorage.setItem('vst_logged_in', 'true');
                    sessionStorage.setItem('vst_user', u);
                    sessionStorage.setItem('vst_role', data.vaiTro); // Lưu thêm quyền hạn
                    
                    // TƯƠNG TÁC: Tự động chuyển hướng người dùng sang trang Sơ đồ bàn
                    window.location.href = 'index.html';
                } else if (res.status === 401) {
                    // TƯƠNG TÁC: C# từ chối truy cập (Mã lỗi 401 - Sai mật khẩu hoặc tài khoản)
                    hienLoiDangNhap('Tài khoản hoặc mật khẩu không chính xác!');
                } else {
                    // TƯƠNG TÁC: Bắt các thông báo lỗi khác do hệ thống C# báo về
                    const data = await res.json();
                    hienLoiDangNhap(data.thongBao || 'Lỗi đăng nhập!');
                }
            } catch {
                // TƯƠNG TÁC: Báo lỗi nếu máy chủ C# đang tắt, không thể kết nối
                hienLoiDangNhap('Không kết nối được máy chủ!');
            }
        }

        function hienLoiDangNhap(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorMsg').classList.remove('hidden');
            const card = document.querySelector('.login-card');
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'shake 0.4s ease-in-out';
        }
    </script>
</body>
</html>
