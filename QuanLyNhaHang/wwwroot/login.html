<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng nhập - Vua Sư Tử</title>
    <!-- FAVICON: Thay đổi biểu tượng chương trình -->
    <link rel="icon" type="image/png" href="img/logo.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        heading: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        "primary": "#d4a853",
                        "primary-hover": "#c49a42",
                        "primary-soft": "#f0d68a",
                        "surface": "#0a1628",
                        "surface-container": "#101e35",
                        "on-surface": "#e8ecf4",
                        "on-surface-variant": "#8b9ab8",
                        "background": "#060d1a"
                    }
                }
            }
        };
    </script>
    <style>
        .login-card {
            background: linear-gradient(145deg, rgba(16, 30, 53, 0.75), rgba(10, 22, 40, 0.9));
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(212, 168, 83, 0.15);
            box-shadow: 
                0 32px 80px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(212, 168, 83, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        /* Hiệu ứng trôi nổi của các quả cầu phát sáng nền */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-25px) scale(1.15); }
        }
        @keyframes float-reverse {
            0%, 100% { transform: translateY(0px) scale(1.1); }
            50% { transform: translateY(25px) scale(0.9); }
        }
        @keyframes float-diagonal {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(15px, -10px) rotate(2deg); }
            66% { transform: translate(-10px, 15px) rotate(-1deg); }
        }
        .glow-orb-1 {
            animation: float-slow 12s ease-in-out infinite;
            filter: blur(90px);
        }
        .glow-orb-2 {
            animation: float-reverse 15s ease-in-out infinite;
            filter: blur(100px);
        }
        .glow-orb-3 {
            animation: float-diagonal 20s ease-in-out infinite;
            filter: blur(80px);
        }

        /* Animation xuất hiện của Card */
        @keyframes card-appear {
            from { opacity: 0; transform: translateY(35px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-card {
            animation: card-appear 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Custom input focus ring glow */
        .premium-input {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .premium-input:focus {
            box-shadow: 0 0 24px rgba(212, 168, 83, 0.2), 0 0 0 3px rgba(212, 168, 83, 0.12);
            border-color: #d4a853 !important;
            background: rgba(255,255,255,0.06);
        }

        /* Decorative patterns */
        .pattern-overlay {
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(212, 168, 83, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(212, 168, 83, 0.02) 0%, transparent 50%);
        }

        /* Gold shimmer animation on button */
        .btn-gold {
            background: linear-gradient(135deg, #d4a853, #f0d68a, #c49a42);
            position: relative;
            overflow: hidden;
        }
        .btn-gold:hover {
            box-shadow: 0 6px 28px rgba(212,168,83,0.35);
            transform: translateY(-1px);
        }
        .btn-gold::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 2.5s infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Logo pulse glow */
        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(212, 168, 83, 0.2); }
            50% { box-shadow: 0 0 35px rgba(212, 168, 83, 0.35); }
        }
        .logo-glow {
            animation: logoGlow 3s ease-in-out infinite;
        }

        /* Subtle floating particles */
        @keyframes float-particle {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-30px) rotate(180deg); opacity: 0.6; }
        }
        .bg-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(212, 168, 83, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: float-particle 8s ease-in-out infinite;
        }

        /* Login card hover effect */
        .login-card {
            transition: box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .login-card:hover {
            box-shadow: 
                0 32px 80px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(212, 168, 83, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="bg-[#060d1a] text-on-surface min-h-screen flex items-center justify-center font-sans relative overflow-hidden pattern-overlay">

    <div class="toast-container" id="toastContainer"></div>

    <!-- Quả cầu phát sáng chạy nền thẩm mỹ -->
    <div class="absolute -top-40 -left-40 w-[400px] h-[400px] rounded-full bg-primary/15 glow-orb-1 pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-[500px] h-[500px] rounded-full bg-primary/8 glow-orb-2 pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] rounded-full bg-amber-600/5 glow-orb-3 pointer-events-none"></div>

    <div class="bg-particle" style="top: 20%; left: 15%; animation-delay: 0s;"></div>
    <div class="bg-particle" style="top: 60%; left: 80%; animation-delay: 2s;"></div>
    <div class="bg-particle" style="top: 80%; left: 25%; animation-delay: 4s;"></div>

    <div class="login-card w-full max-w-md p-8 rounded-3xl mx-4 relative overflow-hidden animate-card z-10">
        <!-- Viền neon vàng kim trên cùng card -->
        <div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-primary/20 via-primary to-primary/20"></div>
        <!-- Viền trang trí dưới cùng -->
        <div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary/10 to-transparent"></div>
        
        <div class="text-center mb-8 relative">
            <div class="relative w-28 h-28 mx-auto mb-5 group">
                <!-- Vòng tròn phát sáng bên dưới logo -->
                <div class="absolute inset-0 rounded-full bg-primary/15 blur-lg group-hover:bg-primary/25 transition duration-500"></div>
                <img src="img/logo.png" alt="Logo Vua Sư Tử" class="relative w-28 h-28 mx-auto rounded-full border-2 border-primary/40 object-cover logo-glow transition duration-500 group-hover:scale-105 group-hover:border-primary/60">
            </div>
            <h1 class="font-heading text-3xl font-extrabold tracking-tight text-primary drop-shadow-sm">NHÀ HÀNG VUA SƯ TỬ</h1>
            <p class="text-on-surface-variant text-sm mt-2.5 font-medium tracking-[0.2em] uppercase" id="subtitleText">HỆ THỐNG QUẢN LÝ CAO CẤP</p>
            <!-- Thanh trang trí dưới subtitle -->
            <div class="flex items-center justify-center gap-3 mt-4">
                <div class="w-8 h-[1px] bg-gradient-to-r from-transparent to-primary/40"></div>
                <img src="img/logo.png" alt="Diamond" class="w-4 h-4 object-contain opacity-50">
                <div class="w-8 h-[1px] bg-gradient-to-l from-transparent to-primary/40"></div>
            </div>
        </div>

        <!-- Form Đăng Ký (Ban đầu) -->
        <form id="registerForm" class="space-y-5 hidden" onsubmit="xuLyDangKy(event)">
            <div class="p-3.5 rounded-xl bg-primary/5 border border-primary/15 text-primary text-sm text-center font-medium leading-relaxed">
                👋 Chào mừng bạn! Vui lòng thiết lập tài khoản quản trị hệ thống để tiếp tục.
            </div>
            
            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant">Tên tài khoản</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 text-lg">person</span>
                    <input type="text" id="txtRegUser" class="premium-input w-full bg-white/[0.04] border border-white/10 rounded-2xl pl-12 pr-4 py-3.5 focus:ring-0 outline-none text-on-surface placeholder-white/20 text-sm font-medium" required placeholder="Tên đăng nhập mới (tối thiểu 3 ký tự)">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant">Mật khẩu</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 text-lg">lock</span>
                    <input type="password" id="txtRegPass" class="premium-input w-full bg-white/[0.04] border border-white/10 rounded-2xl pl-12 pr-12 py-3.5 focus:ring-0 outline-none text-on-surface placeholder-white/20 text-sm font-medium" required placeholder="••••••••  (tối thiểu 4 ký tự)">
                    <button type="button" onclick="togglePassword('txtRegPass', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 hover:text-primary focus:outline-none transition-colors">
                        <span class="material-symbols-outlined text-lg">visibility</span>
                    </button>
                </div>
            </div>

            <!-- Thông báo lỗi đăng ký -->
            <div id="regErrorMsg" class="flex items-center gap-2 text-red-400 text-xs justify-center hidden bg-red-500/8 border border-red-500/15 py-2.5 rounded-xl">
                <img src="img/close_3d.png" alt="Error" class="w-4 h-4 object-contain">
                <span id="regErrorText">Lỗi đăng ký!</span>
            </div>

            <button type="submit" id="btnDangKy" class="btn-gold w-full text-surface font-bold rounded-2xl py-4 transition-all duration-300 transform active:scale-[0.98] uppercase text-xs tracking-widest mt-2 shadow-[0_4px_24px_rgba(212,168,83,0.25)]">
                Thiết Lập Tài Khoản
            </button>

            <div class="text-center mt-3 pt-2">
                <p class="text-xs text-on-surface-variant">Đã có tài khoản? <a href="#" onclick="chuyenForm('login')" class="text-primary hover:text-primary-soft font-bold transition-colors">Đăng nhập ngay</a></p>
            </div>
        </form>

        <!-- Form Đăng Nhập -->
        <form id="loginForm" class="space-y-5 hidden" onsubmit="xuLyDangNhap(event)">
            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant">Tên tài khoản</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 text-lg">person</span>
                    <input type="text" id="txtLogUser" class="premium-input w-full bg-white/[0.04] border border-white/10 rounded-2xl pl-12 pr-4 py-3.5 focus:ring-0 outline-none text-on-surface placeholder-white/20 text-sm font-medium" required placeholder="Nhập tài khoản">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant">Mật khẩu</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 text-lg">lock</span>
                    <input type="password" id="txtLogPass" class="premium-input w-full bg-white/[0.04] border border-white/10 rounded-2xl pl-12 pr-12 py-3.5 focus:ring-0 outline-none text-on-surface placeholder-white/20 text-sm font-medium" required placeholder="••••••••">
                    <button type="button" onclick="togglePassword('txtLogPass', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 hover:text-primary focus:outline-none transition-colors">
                        <span class="material-symbols-outlined text-lg">visibility</span>
                    </button>
                </div>
            </div>

            <div id="errorMsg" class="flex items-center gap-2 text-red-400 text-xs justify-center hidden bg-red-500/8 border border-red-500/15 py-2.5 rounded-xl">
                <img src="img/close_3d.png" alt="Error" class="w-4 h-4 object-contain">
                <span id="errorText">Tài khoản hoặc mật khẩu không chính xác!</span>
            </div>

            <button type="submit" id="btnDangNhap" class="btn-gold w-full text-surface font-bold rounded-2xl py-4 transition-all duration-300 transform active:scale-[0.98] uppercase text-xs tracking-widest mt-2 flex justify-center items-center gap-2 shadow-[0_4px_24px_rgba(212,168,83,0.25)]">
                <img src="img/user_3d.png" alt="Login" class="w-5 h-5 object-contain"> Đăng Nhập
            </button>

            <div class="text-center mt-3 pt-2">
                <p class="text-xs text-on-surface-variant">Chưa có tài khoản? <a href="#" onclick="chuyenForm('register')" class="text-primary hover:text-primary-soft font-bold transition-colors">Tạo tài khoản mới</a></p>
            </div>
        </form>

    </div>

    <script>
        const API = 'http://localhost:5000/api';

        // Kiểm tra hệ thống đã có tài khoản chưa (qua API)
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API}/auth/check`);
                const data = await res.json();
                if (!data.coNguoiDung) {
                    document.getElementById('registerForm').classList.remove('hidden');
                    document.getElementById('subtitleText').innerText = "THIẾT LẬP TÀI KHOẢN QUẢN TRỊ";
                } else {
                    document.getElementById('loginForm').classList.remove('hidden');
                    document.getElementById('subtitleText').innerText = "VUI LÒNG ĐĂNG NHẬP ĐỂ TIẾP TỤC";
                }
            } catch {
                // Fallback nếu server chưa sẵn sàng: hiện form đăng ký
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('subtitleText').innerText = "THIẾT LẬP TÀI KHOẢN QUẢN TRỊ";
            }
        });

        function chuyenForm(formName) {
            if (formName === 'login') {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('subtitleText').innerText = "VUI LÒNG ĐĂNG NHẬP ĐỂ TIẾP TỤC";
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('subtitleText').innerText = "TẠO TÀI KHOẢN MỚI";
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Đăng ký tài khoản - gửi lên API, mật khẩu được băm SHA256 phía server
        async function xuLyDangKy(e) {
            e.preventDefault();
            const u = document.getElementById('txtRegUser').value.trim();
            const p = document.getElementById('txtRegPass').value.trim();
            
            // Validation phía client
            if (u.length < 3) {
                hienLoiDangKy('Tên đăng nhập phải có ít nhất 3 ký tự!');
                return;
            }
            if (p.length < 4) {
                hienLoiDangKy('Mật khẩu phải có ít nhất 4 ký tự!');
                return;
            }

            try {
                const res = await fetch(`${API}/auth/dangky`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ TenDangNhap: u, MatKhau: p })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("✅ " + data.thongBao);
                    window.location.reload();
                } else {
                    hienLoiDangKy(data.thongBao || 'Lỗi đăng ký!');
                }
            } catch {
                hienLoiDangKy('Không kết nối được server! Hãy chạy dotnet run trước.');
            }
        }

        function hienLoiDangKy(msg) {
            const el = document.getElementById('regErrorMsg');
            document.getElementById('regErrorText').textContent = msg;
            el.classList.remove('hidden');
            // Hiệu ứng lắc
            const card = document.querySelector('.login-card');
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'shake 0.4s ease-in-out';
        }

        // Đăng nhập - gửi lên API, server so sánh SHA256 hash
        async function xuLyDangNhap(e) {
            e.preventDefault();
            const u = document.getElementById('txtLogUser').value.trim();
            const p = document.getElementById('txtLogPass').value.trim();

            if (!u || !p) {
                hienLoiDangNhap('Vui lòng nhập đầy đủ thông tin!');
                return;
            }

            try {
                const res = await fetch(`${API}/auth/dangnhap`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ TenDangNhap: u, MatKhau: p })
                });

                if (res.ok) {
                    const data = await res.json();
                    sessionStorage.setItem('vst_logged_in', 'true');
                    sessionStorage.setItem('vst_user', data.tenDangNhap);
                    window.location.href = 'index.html';
                } else if (res.status === 401) {
                    hienLoiDangNhap('Tài khoản hoặc mật khẩu không chính xác!');
                } else {
                    const data = await res.json();
                    hienLoiDangNhap(data.thongBao || 'Lỗi đăng nhập!');
                }
            } catch {
                hienLoiDangNhap('Không kết nối được server!');
            }
        }

        function hienLoiDangNhap(msg) {
            const el = document.getElementById('errorMsg');
            document.getElementById('errorText').textContent = msg;
            el.classList.remove('hidden');
            // Hiệu ứng lắc khi sai mật khẩu
            const card = document.querySelector('.login-card');
            card.style.animation = 'none';
            card.offsetHeight; // Kích hoạt repaint
            card.style.animation = 'shake 0.4s ease-in-out';
        }
    </script>
    
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</body>
</html>
