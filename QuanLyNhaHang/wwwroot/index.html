        tailwind.config = {
            darkMode: "class",
            theme: {

                    colors: {

                        "on-surface-variant": "#8b9ab8",

    <style>
        /* Sidebar styles */
        .sidebar {
            background: linear-gradient(180deg, #0d1a30, #0a1628);
            border-right: 1px solid rgba(212, 168, 83, 0.08);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 76px;
            overflow: hidden;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }
        .sidebar.expanded { width: 240px; }
        .sidebar-text { display: none; white-space: nowrap; font-weight: 600; color: #e8ecf4; margin-left: 0.75rem; }
        .sidebar.expanded .sidebar-text { display: block; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-btn {
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            justify-content: flex-start;
            padding-left: 18px;
            width: 100%;
            height: 52px;
        }
        .nav-btn:hover { background: rgba(212, 168, 83, 0.08); }
        .nav-btn.active {
            color: #d4a853;
            background: rgba(212, 168, 83, 0.1);
        }
        .nav-btn.active::after {
            content: '';
            position: absolute;
            left: 0;
            height: 32px;
            width: 3px;
            background: linear-gradient(180deg, #d4a853, #f0d68a);
            border-radius: 0 4px 4px 0;
        }

        /* Glass card with gold accent (True Liquid Glass) */
        .glass-card {
            background: linear-gradient(145deg, rgba(16, 30, 53, 0.7), rgba(10, 22, 40, 0.8));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 168, 83, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .glass-card:hover {
            background: linear-gradient(145deg, rgba(16, 30, 53, 0.8), rgba(10, 22, 40, 0.9));
            border-color: rgba(212, 168, 83, 0.25);
            box-shadow: 
                0 16px 40px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        /* Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 168, 83, 0.12);
            border-top-color: #d4a853;
            border-radius: 50%;
            margin: 2rem auto;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Ban Card (Liquid Glass + Tactile) */
        .ban-card {
            background: rgba(16, 30, 53, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 168, 83, 0.1);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }
        .ban-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ban-card.trong::before { background: linear-gradient(90deg, #4ade80, transparent); }
        .ban-card.cokhach::before { background: linear-gradient(90deg, #f87171, transparent); }
        .ban-card:hover {
            transform: translateY(-4px);
            background: rgba(16, 30, 53, 0.85);
            box-shadow: 
                0 16px 40px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        .ban-card:active {
            transform: scale(0.97) translateY(0);
        }
        .ban-card.trong:hover { border-color: rgba(74, 222, 128, 0.25); }
        .ban-card.cokhach:hover { border-color: rgba(248, 113, 113, 0.25); }
        .ban-card .ban-icon { margin-bottom: 0.5rem; }
        .ban-card .ban-ten { font-weight: 600; font-size: 1.05rem; color: #e8ecf4; margin-bottom: 0.25rem; }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.65rem;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .badge-trong { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.2); }
        .badge-cokhach { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            letter-spacing: 0.03em;
            transition: all 0.25s;
            border-radius: 12px;
            cursor: pointer;
            border: none;
        }
        .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.75rem; border-radius: 10px; }
        .btn-primary { background: linear-gradient(135deg, #d4a853, #f0d68a, #c49a42); color: #0a1628; box-shadow: 0 2px 12px rgba(212, 168, 83, 0.2); }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(212, 168, 83, 0.35); transform: translateY(-1px); }
        .btn-secondary { background: rgba(255,255,255,0.04); color: #e8ecf4; border: 1px solid rgba(255,255,255,0.08); }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); }
        .btn-danger { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
        .btn-danger:hover { background: #f87171; color: #fff; }
        .btn-info { background: rgba(212, 168, 83, 0.1); color: #d4a853; border: 1px solid rgba(212, 168, 83, 0.2); }
        .btn-info:hover { background: rgba(212, 168, 83, 0.2); }
        .btn-success { background: #4ade80; color: #0a1628; font-weight: 700; }
        .btn-success:hover { background: #22c55e; }
        .btn-lg { padding: 0.75rem 1.5rem; font-size: 0.85rem; border-radius: 14px; }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid rgba(212, 168, 83, 0.08);
            background: rgba(10, 22, 40, 0.4);
            margin-top: 1rem;
        }
        .table-wrapper table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        .table-wrapper th { padding: 0.85rem 1rem; background: rgba(212, 168, 83, 0.04); color: #d4a853; font-weight: 600; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; border-bottom: 1px solid rgba(212, 168, 83, 0.08); }
        .table-wrapper td { padding: 0.95rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.03); color: #e8ecf4; }
        .table-wrapper tr:last-child td { border-bottom: none; }
        .table-wrapper tr:hover { background: rgba(212, 168, 83, 0.03); }

        /* Tong tien box */
        .tong-tien-box {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(212, 168, 83, 0.08), rgba(212, 168, 83, 0.03));
            border: 1px solid rgba(212, 168, 83, 0.12);
        }
        .tong-tien-row { display: flex; justify-content: space-between; align-items: center; }
        .tong-tien-row.tong { font-size: 1.15rem; font-weight: 700; color: #d4a853; }

        /* Alert */
        .alert { padding: 0.85rem 1.25rem; border-radius: 12px; font-size: 0.85rem; border: 1px solid transparent; animation: slideIn 0.3s ease; }
        .alert-success { background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.15); color: #4ade80; }
        .alert-error { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.15); color: #f87171; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        /* Empty state */
        .empty-state { text-align: center; padding: 3rem 1.5rem; }
        .empty-icon { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }
        .text-nhat { color: #8b9ab8; font-size: 0.85rem; }
        .text-chinh { color: #d4a853; }
        .fw-bold { font-weight: 700; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(5, 10, 20, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.show { display: flex; }

        /* Ambient glow */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(100px);
            z-index: 0;
        }
    </style>
</head>

    <script>
        // Đồng bộ hiệu ứng mở/đóng modal mượt mà
        window.moModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.add('show');
                setTimeout(() => {
                    const child = modal.firstElementChild;
                    if (child) {
                        child.classList.remove('scale-95');
                        child.classList.add('scale-100');
                    }
                }, 50);
            }
        };

        window.dongModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) {
                const child = modal.firstElementChild;
                if (child) {
                    child.classList.remove('scale-100');
                    child.classList.add('scale-95');
                }
                setTimeout(() => {
                    modal.classList.remove('show');
                }, 150);
            }
        };
    </script>
</body>
