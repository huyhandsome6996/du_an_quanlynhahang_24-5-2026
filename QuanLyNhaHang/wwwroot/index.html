<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vua Sư Tử - Quản Lý Bàn</title>
    <script>if(!sessionStorage.getItem('vst_logged_in')) window.location.href='login.html';</script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'sans-serif'],
                        heading: ['"Be Vietnam Pro"', 'sans-serif'],
                    },
                    colors: {
                        "primary": "#c0c1ff",
                        "surface": "#0b1326",
                        "surface-container": "#171f33",
                        "surface-container-highest": "#2d3449",
                        "on-surface": "#dae2fd",
                        "on-surface-variant": "#c7c4d7",
                        "background": "#0b1326",
                        "primary-container": "#8083ff",
                        "mau-xanh": "#2ecc71",
                        "mau-do": "#e74c3c"
                    },
                    spacing: {
                        "sidebar-width": "72px",
                        "container-padding": "32px",
                        "grid-gutter": "24px",
                    }
                }
            }
        };
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(192, 193, 255, 0.2);
        }
        .nav-btn.active {
            color: #c0c1ff;
            background: rgba(192, 193, 255, 0.1);
        }
        .nav-btn.active::after {
            content: '';
            position: absolute;
            left: 0;
            height: 32px;
            width: 4px;
            background: #c0c1ff;
            border-radius: 0 4px 4px 0;
        }
        /* Style spinner đẹp */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(192, 193, 255, 0.1);
            border-top-color: #c0c1ff;
            border-radius: 50%;
            margin: 2rem auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Định nghĩa lại CSS cho các Class render từ JS */
        .ban-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .ban-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 24px rgba(0,0,0,0.4);
        }
        .ban-card.trong:hover {
            border-color: rgba(46, 204, 113, 0.3);
        }
        .ban-card.cokhach:hover {
            border-color: rgba(231, 76, 60, 0.3);
        }
        .ban-card .ban-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .ban-card .ban-ten {
            font-weight: 600;
            font-size: 1.1rem;
            color: #dae2fd;
            margin-bottom: 0.25rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.6rem;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-trong { background: rgba(46, 204, 113, 0.1); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.15); }
        .badge-cokhach { background: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.15); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            border-radius: 9999px;
            cursor: pointer;
        }
        .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.72rem; }
        .btn-primary { background: #c0c1ff; color: #0b1326; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #dae2fd; border: 1px solid rgba(255,255,255,0.08); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-danger { background: rgba(231,76,60,0.1); color: #e74c3c; border: 1px solid rgba(231,76,60,0.15); }
        .btn-danger:hover { background: #e74c3c; color: #fff; }
        .btn-info { background: rgba(192, 193, 255, 0.1); color: #c0c1ff; border: 1px solid rgba(192, 193, 255, 0.2); }
        .btn-info:hover { background: rgba(192, 193, 255, 0.2); }
        .btn-success { background: #2ecc71; color: #fff; }
        .btn-success:hover { background: #27ae60; }
        .btn-lg { padding: 0.75rem 1.5rem; font-size: 0.85rem; border-radius: 12px; }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.2);
            margin-top: 1rem;
        }
        .table-wrapper table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        .table-wrapper th { padding: 0.85rem 1rem; background: rgba(255,255,255,0.03); color: #c7c4d7; font-weight: 600; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .table-wrapper td { padding: 0.95rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.03); color: #dae2fd; }
        .table-wrapper tr:last-child td { border-bottom: none; }

        .tong-tien-box {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border-radius: 16px;
            background: rgba(192, 193, 255, 0.05);
            border: 1px solid rgba(192, 193, 255, 0.1);
        }
        .tong-tien-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tong-tien-row.tong {
            font-size: 1.15rem;
            font-weight: 700;
            color: #c0c1ff;
        }

        .alert {
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            font-size: 0.85rem;
            border: 1px solid transparent;
        }
        .alert-success { background: rgba(46,204,113,0.1); border-color: rgba(46,204,113,0.15); color: #2ecc71; }
        .alert-error { background: rgba(231,76,60,0.1); border-color: rgba(231,76,60,0.15); color: #e74c3c; }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
        }
        .empty-icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.75rem;
        }
        .text-nhat {
            color: #c7c4d7;
            font-size: 0.85rem;
        }
        .text-chinh {
            color: #c0c1ff;
        }

        /* Modal Overlay CSS cho JS show/hide */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.show {
            display: flex;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex font-sans">

    <!-- SIDEBAR -->
    <nav class="fixed left-0 top-0 h-screen w-sidebar-width z-50 bg-surface-container border-r border-white/5 flex flex-col items-center py-8 gap-6">
        <img src="img/logo.png" alt="Logo" class="w-12 h-12 rounded-full border border-primary/30 object-cover shadow-[0_0_10px_rgba(192,193,255,0.2)]">
        
        <a href="index.html" class="nav-btn active relative flex items-center justify-center w-12 h-12 rounded-xl text-on-surface-variant hover:text-on-surface transition-all group" title="Sơ đồ bàn">
            <span class="material-symbols-outlined">layers</span>
        </a>

        <a href="menu.html" class="nav-btn relative flex items-center justify-center w-12 h-12 rounded-xl text-on-surface-variant/60 hover:text-on-surface transition-all group" title="Thực đơn">
            <span class="material-symbols-outlined">restaurant_menu</span>
        </a>

        <a href="order.html" class="nav-btn relative flex items-center justify-center w-12 h-12 rounded-xl text-on-surface-variant/60 hover:text-on-surface transition-all group" title="Gọi món">
            <span class="material-symbols-outlined">point_of_sale</span>
        </a>

        <a href="lichsu.html" class="nav-btn relative flex items-center justify-center w-12 h-12 rounded-xl text-on-surface-variant/60 hover:text-on-surface transition-all group" title="Lịch sử hóa đơn">
            <span class="material-symbols-outlined">receipt_long</span>
        </a>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="ml-sidebar-width flex-1 flex flex-col">
        <!-- HEADER -->
        <header class="sticky top-0 h-16 bg-surface/80 backdrop-blur-md border-b border-white/5 flex justify-between items-center px-8 z-40">
            <h1 class="text-xl font-semibold tracking-tight text-on-surface flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">layers</span> Nhà Hàng Vua Sư Tử
            </h1>
            <div class="flex items-center gap-4">
                <div class="text-right mr-4">
                    <p class="text-xs text-on-surface-variant">Hệ thống quản lý</p>
                    <p class="text-sm font-semibold">Vua Sư Tử v1.0</p>
                </div>
                <div class="w-10 h-10 rounded-full overflow-hidden border border-white/10 bg-surface-container-highest flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-surface-variant">account_circle</span>
                </div>
            </div>
        </header>

        <main class="p-8 flex-1">
            <!-- PAGE: SƠ ĐỒ BÀN -->
            <section id="trang-ban" class="page active block">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 gap-4">
                    <div>
                        <h2 class="text-3xl font-bold mb-2 tracking-tight">Sơ đồ bàn</h2>
                        <p class="text-on-surface-variant">Quản lý trạng thái và thông tin bàn ăn trong thời gian thực.</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="moModalThemBan()" class="bg-primary text-surface px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:opacity-90 active:scale-95 transition-all">
                            <span class="material-symbols-outlined">add</span> Thêm Bàn Mới
                        </button>
                        <button onclick="taiDanhSachBan()" class="glass-card text-on-surface px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-white/10 active:scale-95 transition-all">
                            <span class="material-symbols-outlined">refresh</span> Làm Mới
                        </button>
                    </div>
                </div>

                <!-- Khu vực thông báo -->
                <div id="thongBaoKhuVuc" class="mb-6"></div>

                <!-- Thống kê nhanh -->
                <div class="flex gap-6 text-sm bg-surface-container border border-white/5 w-fit px-6 py-3 rounded-2xl mb-8">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-mau-xanh shadow-[0_0_8px_#2ecc71]"></span>
                        <span class="text-on-surface-variant">Bàn trống: <strong id="soBanTrong" class="text-on-surface font-bold text-sm">0</strong></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-mau-do shadow-[0_0_8px_#e74c3c]"></span>
                        <span class="text-on-surface-variant">Có khách: <strong id="soBanCoKhach" class="text-on-surface font-bold text-sm">0</strong></span>
                    </div>
                </div>

                <!-- Lưới bàn -->
                <div id="luoiBan" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <div class="col-span-full flex justify-center py-12">
                        <div class="spinner"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal: Thêm/Sửa Bàn -->
    <div class="modal-overlay" id="modalBan">
        <div class="glass-card bg-surface-container p-8 rounded-3xl w-full max-w-md relative scale-95 transition-transform duration-300">
            <button onclick="dongModal('modalBan')" class="absolute top-4 right-4 text-on-surface-variant hover:text-on-surface">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h3 class="text-2xl font-bold mb-6 text-primary tracking-tight" id="modalBanTieuDe">Thêm Bàn Mới</h3>
            
            <div class="space-y-4">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Tên bàn <span class="text-mau-do">*</span></label>
                    <input type="text" id="inputTenBan" class="bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary focus:ring-0 outline-none transition-all placeholder:text-on-surface-variant/30 text-sm"
                           placeholder="VD: Bàn 7, Bàn VIP 2, Phòng Lạnh 2">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Trạng thái</label>
                    <select id="selectTrangThaiBan" class="bg-surface-container-highest border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary focus:ring-0 outline-none transition-all text-sm cursor-pointer">
                        <option value="Trống">Trống</option>
                        <option value="Có khách">Có khách</option>
                    </select>
                </div>

                <div class="flex gap-3 pt-4">
                    <button onclick="dongModal('modalBan')" class="flex-1 glass-card text-on-surface py-3 rounded-xl font-bold hover:bg-white/10 transition-all">Hủy</button>
                    <button id="btnLuuBan" onclick="luuBan()" class="flex-1 bg-primary text-surface py-3 rounded-xl font-bold hover:opacity-90 transition-all">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Chi tiết bàn (Mở bàn / Xem hóa đơn) -->
    <div class="modal-overlay" id="modalChiTietBan">
        <div class="glass-card bg-surface-container p-8 rounded-3xl w-full max-w-4xl max-h-[90vh] flex flex-col relative scale-95 transition-transform duration-300">
            <button onclick="dongModal('modalChiTietBan')" class="absolute top-4 right-4 text-on-surface-variant hover:text-on-surface">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h3 class="text-2xl font-bold mb-6 text-primary tracking-tight" id="chiTietBanTieuDe">Chi tiết bàn</h3>
            
            <div class="flex-1 overflow-y-auto pr-2" id="chiTietBanNoidung"></div>
            
            <div class="flex justify-end gap-3 pt-6 border-t border-white/5" id="chiTietBanFooter"></div>
        </div>
    </div>

    <script src="js/ban.js?v=1.3"></script>
    <script>
        // Đồng bộ hiệu ứng mở/đóng modal mượt mà
        window.moModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.add('show');
                setTimeout(() => {
                    const child = modal.firstElementChild;
                    if (child) {
                        child.classList.remove('scale-95');
                        child.classList.add('scale-100');
                    }
                }, 50);
            }
        };

        window.dongModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) {
                const child = modal.firstElementChild;
                if (child) {
                    child.classList.remove('scale-100');
                    child.classList.add('scale-95');
                }
                setTimeout(() => {
                    modal.classList.remove('show');
                }, 150);
            }
        };
    </script>
</body>
</html>
