<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vua Sư Tử - Sơ Đồ Bàn</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <!-- Yêu cầu đăng nhập mới được vào trang này -->
    <script>if(!sessionStorage.getItem('vst_logged_in')) window.location.href='login.html';</script>
    <!-- Class trên body cho biết vai trò — ban.js sẽ dùng để ẩn/hiện nút admin -->
    <script>document.documentElement.classList.add('vai-tro-' + (sessionStorage.getItem('vst_vai_tro') || 'NhanVien').toLowerCase());</script>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script>
        // Cấu hình Tailwind — màu chủ đạo + khoảng cách sidebar
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#d4a853",
                        "primary-soft": "#f0d68a",
                        "surface": "#0a1628",
                        "surface-container": "#101e35",
                        "surface-container-highest": "#1e3050",
                        "on-surface": "#e8ecf4",
                        "on-surface-variant": "#8b9ab8",
                        "background": "#0a1628",
                        "mau-xanh": "#4ade80",
                        "mau-do": "#f87171",
                        "mau-vang": "#fbbf24"
                    },
                    spacing: { "sidebar-width": "76px" }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-background text-on-surface min-h-screen flex font-sans relative">

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Quả cầu phát sáng nền -->
    <div class="ambient-glow w-[400px] h-[400px] bg-primary/5 top-0 right-0"></div>
    <div class="ambient-glow w-[300px] h-[300px] bg-primary/3 bottom-0 left-1/4"></div>

    <!-- ========== SIDEBAR (chèn bằng JS) ========== -->
    <!-- JS TƯƠNG TÁC: File sidebar.js sẽ chèn mã HTML của thanh menu vào div này -->
    <div id="sidebar"></div>

    <!-- ========== NỘI DUNG CHÍNH ========== -->
    <div class="ml-sidebar-width flex-1 flex flex-col relative z-10">

        <!-- HEADER -->
        <header class="sticky top-0 h-16 bg-surface/85 backdrop-blur-xl border-b border-primary/5 shadow-sm flex justify-between items-center px-8 z-40">
            <h1 class="text-xl font-bold tracking-tight flex items-center gap-2.5" style="font-family:'Playfair Display',serif;">
                <img src="img/table_3d.png" alt="Icon" class="w-6 h-6 object-cover rounded-md">
                <span class="text-primary">Vua Sư Tử</span>
                <span class="text-on-surface-variant/40 font-light">|</span>
                <span class="text-on-surface-variant text-sm font-normal">Sơ Đồ Bàn</span>
            </h1>
            <div class="flex items-center gap-4">
                <div class="text-right mr-3">
                    <p class="text-[10px] font-bold text-primary/60 uppercase tracking-widest">Hệ thống</p>
                    <p class="text-xs font-semibold text-on-surface-variant">Vua Sư Tử v1.0</p>
                </div>
                <div class="w-10 h-10 rounded-xl overflow-hidden border border-primary/15 bg-surface-container-highest flex items-center justify-center shadow-inner">
                    <img src="img/user_3d.png" class="w-full h-full object-cover" alt="User">
                </div>
            </div>
        </header>

        <!-- MAIN -->
        <main class="p-8 flex-1" style="animation: slideUp 0.5s ease forwards">
            <section id="trang-ban" class="page active block">
                <!-- Tiêu đề + nút bấm -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 gap-4">
                    <div>
                        <h2 class="text-3xl font-bold mb-2 tracking-tight" style="font-family:'Playfair Display',serif;">Sơ đồ bàn</h2>
                        <p class="text-on-surface-variant text-sm">Quản lý trạng thái và thông tin bàn ăn trong thời gian thực.</p>
                    </div>
                    <div class="flex gap-3">
                        <!-- JS TƯƠNG TÁC: Sự kiện click gọi hàm moModalThemBan() để mở form nhập -->
                        <!-- Chỉ Quản trị viên mới thấy nút "Thêm Bàn Mới" (Use Case: "Đổi trạng thái bàn") -->
                        <button id="btnThemBanMoi" onclick="moModalThemBan()" class="btn btn-primary px-5 py-2.5 flex items-center gap-2 font-bold text-sm" style="display:none;">
                            <img src="img/add_3d.png" alt="Add" class="w-5 h-5 object-cover rounded-md"> Thêm Bàn Mới
                        </button>
                        <!-- JS TƯƠNG TÁC: Sự kiện click gọi hàm taiDanhSachBan() để tải lại dữ liệu từ server -->
                        <button onclick="taiDanhSachBan()" class="glass-card text-on-surface px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-white/10 transition-all text-sm cursor-pointer">
                            <img src="img/refresh_3d.png" alt="Refresh" class="w-5 h-5 object-cover rounded-md"> Làm Mới
                        </button>
                    </div>
                </div>

                <!-- Khu vực thông báo nội tuyến -->
                <div id="thongBaoKhuVuc" class="mb-6"></div>

                <!-- Ô tìm kiếm -->
                <div class="mb-6">
                    <div class="flex items-center gap-3 bg-surface-container border border-primary/5 px-5 py-3 rounded-2xl w-full max-w-md transition-all focus-within:border-primary/25">
                        <img src="img/search_3d.png" alt="Search" class="w-5 h-5 object-cover rounded-md opacity-70">
                        <!-- JS TƯƠNG TÁC: Sự kiện oninput chạy hàm timKiemBan() mỗi khi user gõ phím. JS lấy nội dung qua id="txtTimKiemBan" -->
                        <input type="text" id="txtTimKiemBan"
                               class="bg-transparent border-none outline-none text-on-surface text-base flex-1"
                               placeholder="Tìm bàn theo tên..." oninput="timKiemBan()">
                    </div>
                </div>

                <!-- Thống kê nhanh -->
                <div class="flex gap-6 text-sm bg-surface-container border border-primary/5 w-fit px-6 py-3.5 rounded-2xl mb-8 transition-transform duration-300 hover:scale-[1.02]">
                    <div class="flex items-center gap-2.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-mau-xanh shadow-[0_0_8px_#4ade80]"></span>
                        <span class="text-on-surface-variant">Trống: <strong id="soBanTrong" class="text-mau-xanh font-bold">0</strong></span>
                    </div>
                    <div class="w-[1px] bg-white/5"></div>
                    <div class="flex items-center gap-2.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-mau-vang shadow-[0_0_8px_#fbbf24]"></span>
                        <span class="text-on-surface-variant">Đã đặt: <strong id="soBanDaDat" class="text-mau-vang font-bold">0</strong></span>
                    </div>
                    <div class="w-[1px] bg-white/5"></div>
                    <div class="flex items-center gap-2.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-mau-do shadow-[0_0_8px_#f87171]"></span>
                        <span class="text-on-surface-variant">Có khách: <strong id="soBanCoKhach" class="text-mau-do font-bold">0</strong></span>
                    </div>
                </div>

                <!-- Lưới bàn -->
                <!-- JS TƯƠNG TÁC: Div id="luoiBan" là khu vực để JS tạo ra và chèn các ô đại diện cho các Bàn vào đây -->
                <div id="luoiBan" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <div class="col-span-full flex justify-center py-12"><div class="spinner"></div></div>
                </div>
            </section>
        </main>
    </div>

    <!-- ========== MODAL: Thêm/Sửa Bàn ========== -->
    <div class="modal-overlay" id="modalBan">
        <div class="glass-card bg-surface-container p-8 rounded-3xl w-full max-w-md relative scale-95 transition-transform duration-300 border border-primary/10">
            <button onclick="dongModal('modalBan')" class="absolute top-4 right-4 hover:scale-110 transition-transform">
                <img src="img/close_3d.png" alt="Close" class="w-6 h-6 object-cover rounded-lg">
            </button>
            <h3 class="text-2xl font-bold mb-6 text-primary tracking-tight" style="font-family:'Playfair Display',serif;" id="modalBanTieuDe">Thêm Bàn Mới</h3>

            <div class="space-y-4">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Tên bàn <span class="text-mau-do">*</span></label>
                    <!-- JS TƯƠNG TÁC: JS lấy thông tin tên bàn từ input id="txtTenBan" -->
                    <input type="text" id="txtTenBan"
                           class="bg-white/[0.04] border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary outline-none transition-all text-sm"
                           placeholder="VD: Bàn 7, Bàn VIP 2...">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Trạng thái</label>
                    <!-- JS TƯƠNG TÁC: JS lấy thông tin trạng thái từ select id="cboTrangThaiBan" -->
                    <select id="cboTrangThaiBan"
                            class="bg-surface-container-highest border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary outline-none transition-all text-sm cursor-pointer">
                        <option value="Trống">Trống</option>
                        <option value="Đã đặt">Đã đặt</option>
                        <option value="Có khách">Có khách</option>
                    </select>
                </div>

                <div class="flex gap-3 pt-4">
                    <button onclick="dongModal('modalBan')" class="flex-1 glass-card text-on-surface py-3 rounded-xl font-bold hover:bg-white/10 transition-all cursor-pointer">Hủy</button>
                    <!-- JS TƯƠNG TÁC: Gọi hàm luuBan() để thu thập thông tin và gửi yêu cầu tạo/sửa lên API -->
                    <button onclick="luuBan()" class="flex-1 btn btn-primary py-3 rounded-xl font-bold">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODAL: Chi tiết bàn (Mở bàn / Xem hóa đơn) ========== -->
    <div class="modal-overlay" id="modalChiTietBan">
        <div class="glass-card bg-surface-container p-8 rounded-3xl w-full max-w-4xl max-h-[90vh] flex flex-col relative scale-95 transition-transform duration-300 border border-primary/10">
            <button onclick="dongModal('modalChiTietBan')" class="absolute top-4 right-4 hover:scale-110 transition-transform">
                <img src="img/close_3d.png" alt="Close" class="w-6 h-6 object-cover rounded-lg">
            </button>
            <h3 class="text-2xl font-bold mb-6 text-primary tracking-tight" style="font-family:'Playfair Display',serif;" id="chiTietBanTieuDe">Chi tiết bàn</h3>
            <div class="flex-1 overflow-y-auto pr-2" id="chiTietBanNoidung"></div>
            <div class="flex justify-end gap-3 pt-6 border-t border-primary/5" id="chiTietBanFooter"></div>
        </div>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script src="js/common.js"></script>
    <script src="js/sidebar.js"></script>
    <script>chenSidebar('index');</script>
    <script src="js/ban.js"></script>
</body>
</html>
